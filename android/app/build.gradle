plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

android {
  namespace 'com.github.joaovictorsantg.financas'
  compileSdk 34

  defaultConfig {
    applicationId 'com.github.joaovictorsantg.financas'
    minSdk 26
    targetSdk 34
    versionCode 6
    versionName '1.5'
  }

  buildFeatures { buildConfig true }

  buildTypes {
    release { minifyEnabled false }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = '17' }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'androidx.activity:activity-ktx:1.9.2'
  // comprovante de Pix só existe como imagem ou PDF desenhado: ler as letras
  // é o único jeito, e este modelo vem junto e funciona sem internet
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}

name: APK

# o celular não compila nada: quem compila é isto, e o APK sai como artefato
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # o runner já traz o SDK do Android; só faltam as licenças aceitas
      - name: Licenças
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: minhas-financas-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # baixar artefato pelo celular exige login e descompactar um zip; uma
      # release dá link direto, que é o que serve para instalar no aparelho
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk minhas-financas.apk
          gh release delete apk --yes --cleanup-tag 2>/dev/null || true
          gh release create apk minhas-financas.apk \
            --title "Minhas Finanças (APK)" \
            --notes "Compilado de $GITHUB_SHA. Baixe no celular e instale."

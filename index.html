<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minhas Finanças</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#121820">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png" type="image/png">
<style>
:root{
  --base:#121820;--surf:#1a232d;--surf2:#222d39;--line:#2c3945;--line2:#3a4855;
  --ink:#eef2f5;--ink2:#aebbc6;--mute:#78889a;
  --acc:#f5b13d;--accInk:#1a1200;
  --up:#45d9a0;--down:#ff6f6b;--warn:#ffc46b;
  --r-lg:22px;--r-md:16px;--r-sm:10px;
}
@media (prefers-color-scheme:light){:root{
  --base:#eef1f4;--surf:#fff;--surf2:#f5f7f9;--line:#dfe5ea;--line2:#ccd5dd;
  --ink:#16202a;--ink2:#4a5a68;--mute:#76858f;
  --acc:#b87407;--accInk:#fff;--up:#0f9d6b;--down:#d8453f;--warn:#a96c05;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;font-family:Archivo,system-ui,sans-serif;font-size:15px;line-height:1.45;background:var(--base);color:var(--ink);
  font-variant-numeric:tabular-nums;
  height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font-family:inherit}
.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.cur{font-size:.62em;font-weight:500;color:var(--mute);margin-right:.18em;letter-spacing:0}

/* topo */
header{flex:0 0 auto;z-index:12;background:var(--base);padding:calc(12px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) 10px calc(18px + env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent;transition:border-color .2s}
header.stuck{border-bottom-color:var(--line)}
header h1{flex:1;margin:0;font-size:19px;font-weight:600;letter-spacing:-.015em}
.icbtn{width:38px;height:38px;border:0;border-radius:12px;background:var(--surf);color:var(--ink2);display:grid;place-items:center;cursor:pointer}
.icbtn:active{background:var(--surf2)}
main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 calc(16px + env(safe-area-inset-right,0px)) 24px calc(16px + env(safe-area-inset-left,0px));
  max-width:600px;margin:0 auto;width:100%}

/* navegação de mês */
.mnav{display:flex;align-items:center;gap:4px;margin:4px 0 14px}
.mnav b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.mnav b::first-letter{text-transform:uppercase}
.mnav .sp{flex:1}
.mnav button{width:34px;height:34px;border:0;border-radius:10px;background:transparent;color:var(--ink2);cursor:pointer;display:grid;place-items:center}
.mnav button:active{background:var(--surf)}

/* superfícies, por papel */
.hero{background:var(--surf);border-radius:var(--r-lg);padding:20px 18px 18px;margin-bottom:12px}
.grp{background:var(--surf);border-radius:var(--r-md);overflow:hidden;margin-bottom:12px}
.grp>.pad{padding:16px 16px 18px}
.panel{background:var(--surf);border-radius:var(--r-md);padding:16px;margin-bottom:12px;border-left:4px solid var(--edge,transparent)}
h2{font-size:13px;font-weight:600;color:var(--mute);margin:22px 2px 8px;display:flex;align-items:center;gap:8px;letter-spacing:.01em}
h2 .sp{flex:1}
h2 a{font-size:13px;font-weight:500;color:var(--acc);cursor:pointer;text-decoration:none}

/* números */
.vbig{font-size:38px;font-weight:600;letter-spacing:-.035em;line-height:1.05;display:block}
.vmid{font-size:17px;font-weight:600;letter-spacing:-.02em}
.lbl{font-size:13px;color:var(--mute);font-weight:500}
.up{color:var(--up)}.down{color:var(--down)}.warnc{color:var(--warn)}

/* medidor de ritmo */
.gauge{position:relative;height:10px;background:var(--surf2);border-radius:5px;margin:14px 0 0;overflow:visible}
.gauge .fill{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:5px}
.gauge .fill.ok{background:var(--up)}.gauge .fill.hot{background:var(--down)}
.gauge .mark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:2px;opacity:.85}
.gauge .mark::after{content:'';position:absolute;top:-4px;left:-3px;width:8px;height:4px;background:var(--ink);clip-path:polygon(50% 100%,0 0,100% 0)}
.bar{height:6px;background:var(--surf2);border-radius:3px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--acc)}
.bar>i.ok{background:var(--up)}.bar>i.hot{background:var(--down)}.bar>i.warn{background:var(--warn)}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:10px;gap:2px}
.split i{display:block;height:100%}

/* trio de métricas */
.plin{display:flex;align-items:baseline;gap:8px;margin-top:10px;font-size:14px}
.plin .pb{width:9px;height:9px;border-radius:3px;flex:none;align-self:center}
.plin .sp2{flex:1}
.plin .pp{min-width:34px;text-align:right}
.real{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.real .lbl{flex:1}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:var(--r-sm);overflow:hidden;margin-top:16px}
.trio>div{background:var(--surf);padding:10px 11px}
.trio .lbl{font-size:11.5px}
.trio b{display:block;font-size:15px;font-weight:600;letter-spacing:-.02em;margin-top:1px}

/* listas */
.rows>*{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font-size:15px}
.rows>*:first-child{border-top:0}
.rows>*:active{background:var(--surf2)}
.rows .mid{flex:1;min-width:0}
.rows .mid .t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.rows .mid .t2{font-size:12.5px;color:var(--mute);margin-top:1px}
.rows .end{text-align:right;flex:none}
.ico{width:36px;height:36px;border-radius:11px;background:var(--surf2);display:grid;place-items:center;font-size:17px;flex:none}

/* envelopes de orçamento */
.env{padding:13px 16px;border-top:1px solid var(--line);cursor:pointer}
.env:first-child{border-top:0}
.env:active{background:var(--surf2)}
.env .top{display:flex;align-items:baseline;gap:8px}
.env .nm{flex:1;font-weight:500}
.env .sub{font-size:12.5px;color:var(--mute);margin-top:5px}

.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--surf2);color:var(--mute);white-space:nowrap;letter-spacing:.01em}
.tag.ok{background:rgba(69,217,160,.16);color:var(--up)}
.tag.hot{background:rgba(255,111,107,.16);color:var(--down)}
.tag.warn{background:rgba(255,196,107,.16);color:var(--warn)}

.note{background:var(--surf);border-radius:var(--r-md);padding:14px 16px;margin-bottom:12px;border-left:4px solid var(--down);font-size:14px;line-height:1.5}
.note b{display:block;margin-bottom:3px}
.hint{font-size:12.5px;color:var(--mute);line-height:1.5;padding:2px 4px 8px}
.blank{text-align:center;color:var(--mute);padding:28px 16px;font-size:14px}

/* botões */
.btn{border:0;border-radius:13px;padding:13px 16px;font-size:15px;font-weight:600;cursor:pointer;background:var(--acc);color:var(--accInk);width:100%;letter-spacing:-.005em}
.btn:active{filter:brightness(.92)}
.btn.g{background:var(--surf2);color:var(--ink)}
.btn.d{background:transparent;color:var(--down);border:1px solid var(--line2)}
.btn.s{width:auto;padding:8px 13px;font-size:13.5px;border-radius:10px}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:92px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
.chips .btn{width:auto;flex:0 0 auto;padding:9px 13px;font-size:14px;min-width:0}
a.btn{display:block;text-align:center;text-decoration:none;box-sizing:border-box}
.acts.fim{position:sticky;bottom:0;z-index:2;background:var(--base);margin-top:18px;
  padding:12px 0 calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}

/* barra inferior */
nav{flex:0 0 auto;z-index:12;background:var(--surf);border-top:1px solid var(--line);
  display:flex;padding:8px calc(6px + env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) calc(6px + env(safe-area-inset-left,0px))}
nav button{flex:1;border:0;background:none;color:var(--mute);font-size:10.5px;font-weight:500;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 2px;border-radius:10px}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:19px;border:0;
  background:var(--acc);color:var(--accInk);z-index:13;cursor:pointer;display:grid;place-items:center}
.fab svg{width:25px;height:25px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.fab:active{transform:scale(.94)}

/* Instalado, o Android pode desenhar sob as barras e ainda assim informar
   zero como tamanho delas. max() pega o que for maior: a medida real quando
   ela existe, um mínimo decente quando não existe. */
@media (display-mode: standalone), (display-mode: fullscreen){
  header{padding-top:calc(12px + max(env(safe-area-inset-top,0px), 28px))}
  /* barra de três botões do Android tem 48px; a de gestos, menos. max() usa a
     medida do sistema quando ela vem, e cobre o caso pior quando vem zero */
  nav{padding-bottom:calc(10px + max(env(safe-area-inset-bottom,0px), 48px))}
  .fab{bottom:calc(86px + max(env(safe-area-inset-bottom,0px), 48px))}
  .toast{bottom:calc(158px + max(env(safe-area-inset-bottom,0px), 48px))}
}

/* painel deslizante */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--base);width:100%;max-width:600px;border-radius:24px 24px 0 0;padding:0 18px calc(28px + env(safe-area-inset-bottom,0px));
  max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;position:relative}
.handle{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:10px auto 2px}
.sheet h3{margin:0 0 4px;font-size:19px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;
  position:sticky;top:0;z-index:2;background:var(--base);padding:10px 0 10px}
.sheet h3 .sp{flex:1}
.sheet h4{margin:22px 0 2px;font-size:13px;font-weight:600;color:var(--mute)}
label{display:block;font-size:12.5px;color:var(--mute);margin:14px 0 5px;font-weight:500}
input,select{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-size:16px}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
input.big{font-size:30px;font-weight:600;letter-spacing:-.03em;padding:12px 13px}
.seg{display:flex;background:var(--surf);border-radius:13px;padding:4px;gap:4px;margin-top:4px}
.seg button{flex:1;border:0;background:none;padding:10px 4px;border-radius:10px;color:var(--ink2);font-size:14px;font-weight:500;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--accInk);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ilin{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.ilin.off{opacity:.38}
.ick{flex:none;width:26px;height:26px;margin-top:2px;border-radius:8px;border:1.5px solid var(--line2);
  background:none;color:var(--accInk);font-size:15px;line-height:1;cursor:pointer;padding:0}
.ilin:not(.off) .ick{background:var(--acc);border-color:var(--acc)}
.imid{flex:1;min-width:0}
.imid .t1{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imid .t2{font-size:12px;color:var(--mute);margin-top:2px}
.iend{flex:none;text-align:right;max-width:44%}
.icat{font-size:12px;padding:5px 6px;border-radius:8px;margin-top:5px;width:auto;max-width:100%}
.catrow{display:grid;grid-template-columns:44px minmax(0,1fr) 78px 30px;gap:6px;align-items:center;margin:7px 0}
.catrow input{padding:9px 6px;font-size:15px;border-radius:9px;min-width:0}
.catrow input:first-child{padding:9px 2px}
.rm{border:0;background:none;color:var(--mute);border-radius:8px;height:36px;cursor:pointer;font-size:20px;line-height:1;padding:0}
.rm:active{color:var(--down)}

.toast{position:fixed;left:50%;bottom:calc(158px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--base);padding:11px 17px;border-radius:13px;font-size:14px;font-weight:500;
  z-index:40;opacity:0;transition:opacity .18s;pointer-events:none;max-width:86vw;text-align:center}
.toast.on{opacity:1}
svg.chart text{fill:var(--mute);font-size:10px;font-family:Archivo,sans-serif}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="hd"><h1 id="titulo">Início</h1>
  <button class="icbtn" onclick="abrirAjustes()" aria-label="Ajustes"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.5 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 7.5a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H7a1.6 1.6 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V7a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z" transform="translate(1 1) scale(.92)"/></svg></button>
</header>
<main id="main"></main>
<button class="fab" onclick="novo('d')" aria-label="Novo lançamento"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav id="nav"></nav>
<div class="ov" id="ov" onclick="if(event.target===this)fechar()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
const VERSAO='v100 — 26/11';
const $=s=>document.querySelector(s);
const brl=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const n2=v=>Math.abs(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const money=(v,cls)=>`<span class="n ${cls||''}">${v<0?'−':''}<span class="cur">R$</span>${n2(v)}</span>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const mk=d=>d.slice(0,7);
const addM=(k,n)=>{let[y,m]=k.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+p2(m)};
const difD=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const difM=(a,b)=>{const[y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return (y2-y1)*12+(m2-m1)};
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const nomeMes=k=>{const[y,m]=k.split('-');return MES[m-1]+' de '+y};
const curtoMes=k=>{const[y,m]=k.split('-');return MES[m-1].slice(0,3)+'/'+y.slice(2)};
const dataBR=d=>d.slice(8,10)+'/'+d.slice(5,7);
const diasNo=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=s=>{s=String(s??'').replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const v=parseFloat(s);return isFinite(v)?v:NaN};
const clone=o=>JSON.parse(JSON.stringify(o));
const pct=(a,b)=>b>0?Math.min(100,a/b*100):0;
const r2=v=>Math.round(v*100)/100;
const r4=v=>Math.round(v*10000)/10000;

const DEF={
  regras:[], destNotif:{}, notifDireto:true, ultComp:'', ultPromo:'', promoFora:0, vistoVer:'', salario:0, metaInvest:0, cotAt:'', cotTs:0, salarioQuando:'pu', nome:'', wkUrl:'', bancos:[], syncAuto:true, syncDireto:false, syncTs:0,
  contas:[
    {id:'conta',emoji:'🏦',nome:'Conta',saldo:0},
    {id:'dinheiro',emoji:'💵',nome:'Dinheiro',saldo:0}
  ],
  cartoes:[],
  categorias:[
    {id:'alim',emoji:'🍔',nome:'Alimentação',orc:0},
    {id:'transp',emoji:'⛽',nome:'Transporte',orc:0},
    {id:'lazer',emoji:'🎮',nome:'Lazer',orc:0},
    {id:'casa',emoji:'🏠',nome:'Casa e contas',orc:0},
    {id:'saude',emoji:'💊',nome:'Saúde',orc:0},
    {id:'outros',emoji:'📦',nome:'Outros',orc:0}
  ],
  ativos:[],
  objetivos:[],
  faturasPagas:{}
};
const RECS=[{id:'salario',emoji:'💼',nome:'Salário'},{id:'extra',emoji:'💸',nome:'Renda extra'},{id:'reemb',emoji:'↩️',nome:'Reembolso'}];
const TIPOS=['Reserva / CDB liquidez diária','Tesouro Direto','CDB / LCI / LCA','Ações','FIIs','ETFs','Cripto','Outro'];
const ICO={
 inicio:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/>',
 lanc:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8.5 8.5h7M8.5 12.5h7M8.5 16.5h4"/>',
 cartoes:'<rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/>',
 investir:'<path d="M4 16.5 9.5 11l3.5 3.5L20 7"/><path d="M15 7h5v5"/>',
 planos:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor"/>'
};
const ABAS=[['inicio','Início'],['lanc','Extrato'],['cartoes','Cartões'],['investir','Investir'],['planos','Planos']];

let cfg=clone(DEF), meses={};
const st={tab:'inicio',mes:mk(hoje()),filtro:'',fTipo:'',fOnde:''};

const KEY='financas-joao-v3', TKKEY='brapi-token';
function cache(){try{localStorage.setItem(KEY,JSON.stringify({cfg,meses}))}catch(e){toast('Sem espaço para salvar neste aparelho')}}
try{const c=JSON.parse(localStorage.getItem(KEY)||'null');if(c){cfg=Object.assign(clone(DEF),c.cfg);meses=c.meses||{};
  // nasceu desligado por cautela, mas a cautela já está no próprio critério:
  // só entra direto o que vem de um destino escolhido antes
  if(!cfg.diretoPadrao){cfg.diretoPadrao=1;cfg.notifDireto=true}
}}catch(e){}
function gravar(){cache()}
function salvarCfg(){cache();render()}
function salvarMes(){cache();render()}

/* ---------- cotações pela brapi ---------- */
const LIVRES=['PETR4','VALE3','ITUB4','MGLU3'];
const tkDe=a=>String(a.tk||a.nome||'').trim().toUpperCase();
const getTk=()=>{try{return localStorage.getItem(TKKEY)||''}catch(e){return ''}};
const setTk=v=>{try{v?localStorage.setItem(TKKEY,v.trim()):localStorage.removeItem(TKKEY)}catch(e){}};
const precisaTk=()=>cfg.ativos.some(a=>a.rv&&!LIVRES.includes(tkDe(a)));
let buscando=false;

async function umPreco(sym,tk){
  const u='https://brapi.dev/api/quote/'+encodeURIComponent(sym)+(tk?'?token='+encodeURIComponent(tk):'');
  const r=await fetch(u,{cache:'no-store'});
  if(r.status===401||r.status===403)throw new Error('token');
  if(r.status===404)throw new Error('ticker');
  if(r.status===429)throw new Error('limite');
  if(!r.ok)throw new Error('http');
  const j=await r.json(), q=j&&j.results&&j.results[0], p=q&&q.regularMarketPrice;
  if(!(p>0))throw new Error('vazio');
  return p;
}
async function buscarCotacoes(auto){
  const rv=cfg.ativos.filter(a=>a.rv);
  if(!rv.length||buscando)return;
  if(!navigator.onLine){if(!auto)toast('Sem internet agora');return}
  const tk=getTk();
  // sem token, ainda dá para atualizar as ações liberadas pela brapi
  const alvo=tk?rv:rv.filter(a=>LIVRES.includes(tkDe(a)));
  const bloq=rv.length-alvo.length;
  if(!alvo.length){if(!auto)formToken();return}
  buscando=true;if(!auto)toast('Buscando cotações…');
  const res=await Promise.allSettled(alvo.map(a=>umPreco(tkDe(a),tk)));
  buscando=false;
  let ok=0;const erros=new Set();
  res.forEach((r,i)=>{if(r.status==='fulfilled'){alvo[i].cot=r4(r.value);ok++}else erros.add(r.reason&&r.reason.message||'falha')});
  if(bloq&&!auto)erros.add('semtoken');
  if(ok){const d=new Date();cfg.cotTs=d.getTime();
    cfg.cotAt=p2(d.getDate())+'/'+p2(d.getMonth()+1)+' às '+p2(d.getHours())+':'+p2(d.getMinutes());
    cache();render()}
  if(!ok||!auto){
    if(erros.has('token'))toast('Token recusado pela brapi. Confira em Ajustes.');
    else if(erros.has('limite'))toast('Limite de consultas da brapi atingido por agora.');
    else if(erros.has('ticker'))toast('Algum código de ação não foi encontrado.');
    else if(!ok)toast('Não deu para buscar as cotações agora.');
    else if(erros.has('semtoken'))toast(ok+' atualizada(s). Cole o token para as outras.');
    else if(erros.size)toast(ok+' de '+alvo.length+' atualizadas.');
    else toast('Cotações atualizadas');
  }
}

  abrir(cab('Token da brapi')+`<p class="hint" style="padding-left:0">ITUB4 funciona sem token. Para WEGE3, CPLE3 e qualquer outra ação, crie um token gratuito em brapi.dev e cole aqui. Ele fica só neste aparelho.</p>
  <label>Token</label><input id="tk_v" value="${esc(getTk())}" placeholder="cole aqui" autocomplete="off" spellcheck="false">

/* ---------- backup ---------- */
function exportar(){
  const texto=JSON.stringify({app:'minhas-financas',v:3,em:new Date().toISOString(),cfg,meses},null,2);
  const nome='financas-'+hoje()+'.json';
  // no aplicativo Android o download comum não sai do WebView: quem grava é ele
  try{
    if(noAparelho()&&typeof Aparelho.guardarArquivo==='function'){
      const b64=btoa(String.fromCharCode(...new TextEncoder().encode(texto)));
      const onde=Aparelho.guardarArquivo(nome,b64);
      return toast(onde?'Backup salvo em '+onde:'Não deu para salvar o backup');
    }
  }catch(e){ return toast('Não deu para salvar o backup') }
  try{
    const b=new Blob([texto],{type:'application/json'});
    const u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),3000);toast('Backup baixado');
  }catch(e){toast('Não deu para baixar o backup')}
}
function importar(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const fr=new FileReader();
  fr.onerror=()=>toast('Não deu para abrir o arquivo');
  fr.onload=()=>{
    let j;
    try{j=JSON.parse(fr.result)}
    catch(e){inp.value='';return toast('Esse arquivo não é um backup. Procure o .json que termina com a data.')}
    if(!j||!j.cfg){inp.value='';return toast('Esse .json não é um backup deste app.')}
    try{
      // a conexão com o banco é deste aparelho, não do backup: um backup
      // antigo não pode desfazer o que já está ligado aqui
      const liga={wkUrl:cfg.wkUrl,bancos:cfg.bancos,syncAuto:cfg.syncAuto,syncDireto:cfg.syncDireto};
      cfg=Object.assign(clone(DEF),j.cfg);meses=j.meses||{};rasc=null;
      if(liga.wkUrl&&!(j.cfg.wkUrl||''))cfg.wkUrl=liga.wkUrl;
      if((liga.bancos||[]).length&&!((j.cfg.bancos||[]).length)){
        cfg.bancos=liga.bancos;cfg.syncAuto=liga.syncAuto;cfg.syncDireto=liga.syncDireto;
      }
      cache();inp.value='';fechar();render();
      const n=cfg.cartoes.length,a=cfg.ativos.length;
      toast('Restaurado: '+n+' cart'+(n===1?'ão':'ões')+' e '+a+' investimento'+(a===1?'':'s'));
    }catch(e){inp.value='';toast('O arquivo abriu, mas veio incompleto')}
  };
  fr.readAsText(f);
}

function iniciar(){
  render();
  if('serviceWorker' in navigator){
    const jaControlado=!!navigator.serviceWorker.controller;
    let recarregando=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      // só recarrega quando uma versão nova assume, nunca na primeira instalação
      if(jaControlado&&!recarregando){recarregando=true;location.reload()}
    });
    // updateViaCache:'none' impede o navegador de usar cópia em cache do sw.js
    navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'})
      .then(reg=>{
        reg.update().catch(()=>{});
        addEventListener('visibilitychange',()=>{
          if(document.visibilityState==='visible')reg.update().catch(()=>{});
        });
      }).catch(()=>{});
  }
  // saber qual versão está em pé não devia depender de procurar: quando ela
  // muda, o app diz
  if(cfg.vistoVer&&cfg.vistoVer!==VERSAO)setTimeout(()=>toast('Atualizado para '+VERSAO),700);
  if(cfg.vistoVer!==VERSAO){cfg.vistoVer=VERSAO;cache()}
  const velho=!cfg.cotTs||(Date.now()-cfg.cotTs)>15*60*1000;
  if(velho)buscarCotacoes(true);
  syncAoAbrir(); notifsAoAbrir();
  addEventListener('visibilitychange',()=>{
    if(document.visibilityState!=='visible')return;
    if(!cfg.cotTs||(Date.now()-cfg.cotTs)>15*60*1000)buscarCotacoes(true);
    syncAoAbrir(); notifsAoAbrir();
  });
}

/* ---------- cálculos ---------- */
const todos=()=>Object.values(meses).flat();
const cartao=id=>cfg.cartoes.find(c=>c.id===id);
const conta=id=>cfg.contas.find(c=>c.id===id);
const catInfo=id=>cfg.categorias.find(c=>c.id===id)||RECS.find(c=>c.id===id)||{emoji:'❔',nome:'Sem categoria'};
const ativo=id=>cfg.ativos.find(a=>a.id===id);
const pgNome=id=>{const c=cartao(id);if(c)return 'Cartão '+c.nome;const k=conta(id);return k?k.nome:id};
function partes(tx){
  const c0=cartao(tx.pg);
  // veio de uma fatura em PDF: pertence inteira àquela fatura
  if(c0&&tx.fat)return [{comp:mesVenc(c0,tx.fat),fat:tx.fat,v:tx.v,i:1,n:1}];
  const n=Math.max(1,tx.parc||1),base=mk(tx.data),c=c0;
  // o dia de corte é o da fatura daquele mês, que pode ter data própria
  let f0=null;if(c)f0=proxFat(c,(+tx.data.slice(8,10)>=fechaDia(c,base))?addM(base,1):base);
  const tot=Math.round(tx.v*100),each=Math.floor(tot/n),out=[];
  for(let i=0;i<n;i++)out.push({comp:addM(base,i),fat:c?proxFat(c,addM(f0,i)):null,v:(i<n-1?each:tot-each*(n-1))/100,i:i+1,n});
  return out;
}
function doMes(M){
  const r=[];todos().forEach(tx=>partes(tx).forEach(p=>{if(p.comp===M)r.push({tx,p})}));
  return r.sort((a,b)=>b.tx.data.localeCompare(a.tx.data)||b.tx.id.localeCompare(a.tx.id));
}
function resumo(M){
  let rec=0,desp=0,apo=0;const porCat={};
  doMes(M).forEach(({tx,p})=>{if(tx.t==='r')rec+=p.v;else if(tx.t==='a')apo+=p.v;else{desp+=p.v;porCat[tx.cat]=(porCat[tx.cat]||0)+p.v}});
  return{rec:r2(rec),desp:r2(desp),apo:r2(apo),sobra:r2(rec-desp-apo),porCat};
}
const orcTotal=()=>r2(cfg.categorias.reduce((s,c)=>s+(+c.orc||0),0));
// O "normal" de um gasto é a mediana dos meses fechados, não a média: um mês
// atípico puxa a média e passa a justificar o próximo mês atípico.
const mediana=a=>{const v=(a||[]).filter(x=>x!=null).sort((x,y)=>x-y),n=v.length;
  return n?r2(n%2?v[(n-1)/2]:(v[n/2-1]+v[n/2])/2):0};
function analise(M){
  const r=resumo(M), hj=hoje(), atual=mk(hj);
  const fech=Object.keys(meses).filter(k=>k<M&&(meses[k]||[]).length).sort().slice(-6);
  const tot=[], porCat={};
  fech.forEach(k=>{const rr=resumo(k);tot.push(rr.desp);
    cfg.categorias.concat(Object.keys(rr.porCat).map(id=>({id}))).forEach(c=>{
      porCat[c.id]=porCat[c.id]||[];});
    Object.keys(porCat).forEach(c=>porCat[c].push(rr.porCat[c]||0));});
  const normal={}; Object.keys(porCat).forEach(c=>{normal[c]=mediana(porCat[c])});
  const d=M===atual?+hj.slice(8,10):0, dias=diasNo(M);
  return {r,fech:fech.length,normalTot:mediana(tot),normal,d,dias,
    proj:d&&d<dias?r2(r.desp*dias/d):0};
}
// mudar o dia de fechamento faz o banco juntar dois ciclos num só, e uma
// fatura deixa de existir. O que cairia nela entra na seguinte.
const pulada=(c,F)=>!!(c&&c.pula&&c.pula.indexOf(F)>=0);
const proxFat=(c,F)=>{let f=F;for(let i=0;i<24&&pulada(c,f);i++)f=addM(f,1);return f};
const fatAberta=c=>{const h=hoje(),M=mk(h);return proxFat(c,+h.slice(8,10)>=fechaDia(c,M)?addM(M,1):M)};
// uma fatura pode ter dias próprios: na virada do ciclo o banco fecha e
// cobra em datas que não são as de sempre
const diasFat=(c,F)=>(c&&c.datas&&c.datas[F])||null;
const fechaDia=(c,F)=>{const d=diasFat(c,F);return (d&&+d.f)||+c.fecha};
const venceDia=(c,F)=>{const d=diasFat(c,F);return (d&&+d.v)||+c.vence};
const mesVenc=(c,F)=>venceDia(c,F)>fechaDia(c,F)?F:addM(F,1);
const fechaData=(c,F)=>p2(fechaDia(c,F))+'/'+F.slice(5,7);
const venceData=(c,F)=>p2(venceDia(c,F))+'/'+mesVenc(c,F).slice(5,7);
const pagaKey=(c,F)=>c.id+':'+F;
const paga=(c,F)=>!!cfg.faturasPagas[pagaKey(c,F)];
function pagaPor(c,F){
  const v=cfg.faturasPagas[pagaKey(c,F)];
  if(v&&typeof v==='object'&&conta(v.c))return v.c;
  if(typeof v==='string'&&conta(v))return v;
  return c.conta;
}
const pagaEm=(c,F)=>{const v=cfg.faturasPagas[pagaKey(c,F)];return (v&&typeof v==='object'&&v.d)||''};
const vencISO=(c,F)=>{const mv=mesVenc(c,F);return mv+'-'+p2(Math.min(c.vence,diasNo(mv)))};
// semAjuste: só o que foi comprado, sem o saldo anterior. É contra isso que se
// mede a diferença até o total que o banco informa.
function faturas(c,semAjuste){
  const m={};
  if(!semAjuste)Object.keys(c.aberturas||{}).forEach(F=>{const K=proxFat(c,F);m[K]=r2((m[K]||0)+c.aberturas[F])});
  todos().forEach(tx=>{if(tx.pg!==c.id||tx.t!=='d')return;partes(tx).forEach(p=>m[p.fat]=r2((m[p.fat]||0)+p.v))});
  return m;
}
function usado(c){const f=faturas(c);let u=0;for(const F in f)if(!paga(c,F))u+=f[F];return r2(u)}
const totalCartoes=()=>r2(cfg.cartoes.reduce((s,c)=>s+usado(c),0));
function saldoConta(id){
  let s=+((conta(id)||{}).saldo)||0;
  todos().forEach(tx=>{if(tx.pg===id)s+=tx.t==='r'?tx.v:-tx.v});
  cfg.cartoes.forEach(c=>{const f=faturas(c);for(const F in f)if(paga(c,F)&&pagaPor(c,F)===id)s-=f[F]});
  return r2(s);
}
const totalContas=()=>r2(cfg.contas.reduce((s,c)=>s+saldoConta(c.id),0));
// lançamento cujo destino sumiu: zerar a configuração apaga as contas e
// deixa os lançamentos apontando para um id que não existe mais
const orfaos=()=>todos().filter(t=>!conta(t.pg)&&!cartao(t.pg));
// pagamento da fatura lançado como compra: entrou antes do app saber separar
const pagtosNoCartao=()=>todos().filter(t=>t.t==='d'&&cartao(t.pg)&&natureza(t.desc)==='fatura');
const valAtivo=a=>a.rv?r2((+a.qtd||0)*(+a.cot||0)):r2(+a.atual||0);
function custoAtivo(a){
  if(a.rv)return r2((+a.qtd||0)*(+a.pm||0));
  let s=+a.inicial||0;todos().forEach(tx=>{if(tx.t==='a'&&tx.ativo===a.id)s+=tx.v});return r2(s);
}
const totalInvest=()=>r2(cfg.ativos.reduce((s,a)=>s+valAtivo(a),0));
const totalCusto=()=>r2(cfg.ativos.reduce((s,a)=>s+custoAtivo(a),0));
const patrimonio=()=>r2(totalContas()+totalInvest()-totalCartoes());
// Quanto cada categoria costuma consumir. Dois cuidados: a média é tirada a
// partir do mês em que a categoria apareceu pela primeira vez, senão quem
// começou a ser usada agora fica diluída em meses de zero; e o mês corrente
// entra projetado para o mês inteiro, porque é o que melhor descreve hoje.
function mediaPorCat(n){
  const atual=mk(hoje()), dm=diasNo(atual), d=Math.max(1,+hoje().slice(8,10));
  const fech=Object.keys(meses).filter(k=>k<atual&&(meses[k]||[]).length).sort().slice(-(n||6));
  const gasto={}, visto={};
  fech.forEach((k,i)=>(meses[k]||[]).forEach(t=>{if(t.t!=='d')return;
    gasto[t.cat]=gasto[t.cat]||[];gasto[t.cat][i]=(gasto[t.cat][i]||0)+(+t.v||0);
    if(visto[t.cat]==null)visto[t.cat]=i;}));
  const hojeCat={};
  (meses[atual]||[]).forEach(t=>{if(t.t==='d')hojeCat[t.cat]=(hojeCat[t.cat]||0)+(+t.v||0)});
  const cats={}, proj={};
  Object.keys(gasto).forEach(k=>{
    const desde=visto[k], n2=fech.length-desde;
    let soma=0;for(let i=desde;i<fech.length;i++)soma+=gasto[k][i]||0;
    cats[k]=r2(soma/Math.max(1,n2));
  });
  Object.keys(hojeCat).forEach(k=>{proj[k]=r2(hojeCat[k]*dm/d);if(cats[k]==null)cats[k]=0});
  return {ms:fech.length,cats,proj,dia:d,dias:dm};
}
// Reparte o que sobra depois da meta de investir. Uma categoria com nome
// é um compromisso e recebe o que de fato consome; "Outros" é o que sobrou
// de tudo o que não foi classificado, e fica com o resto em vez de abocanhar
// o orçamento inteiro só por ser o maior monte.
function sugereOrc(n){
  const disp=r2((+cfg.salario||0)-(+cfg.metaInvest||0));
  const M=mediaPorCat(n);
  const dez=v=>Math.max(10,Math.round(v/10)*10);
  const chaves=Object.keys(M.cats).filter(k=>k!=='outros');
  // o que cada uma precisa: o costume, nunca abaixo do ritmo deste mês
  const prec={}; chaves.forEach(k=>{prec[k]=Math.max(M.cats[k]||0,M.proj[k]||0)});
  const somaN=r2(Object.values(prec).reduce((a,b)=>a+b,0));
  const fator=somaN>disp&&somaN>0?disp/somaN:1;
  const prop={}; chaves.forEach(k=>{if(prec[k]>0)prop[k]=dez(prec[k]*fator)});
  const usado=r2(Object.values(prop).reduce((a,b)=>a+b,0));
  const sobra=r2(disp-usado);
  const precOut=Math.max(M.cats.outros||0,M.proj.outros||0);
  if(precOut>0||sobra>0)prop.outros=Math.max(0,Math.round(Math.min(sobra>0?sobra:0,Math.max(precOut,sobra))/10)*10);
  if(prop.outros===0)delete prop.outros;
  return {disp,ms:M.ms,dia:M.dia,dias:M.dias,soma:r2(somaN+precOut),fator,prec,proj:M.proj,
    prop,total:r2(Object.values(prop).reduce((a,b)=>a+b,0))};
}
/**
 * Quanto comprar por mês em cada cartão.
 *
 * O cartão não cria dinheiro, só adia a saída dele: o teto de todos os
 * cartões somados é o que sobra do salário depois da meta de investir. Cada
 * cartão fica com a fatia que ele de fato usa, porque é assim que a conta
 * fecha sem obrigar ninguém a mudar de hábito, e nunca acima do limite —
 * que é um teto que o banco já impôs.
 */
function mediaCartao(n){
  const atual=mk(hoje());
  const fech=Object.keys(meses).filter(k=>k<atual&&(meses[k]||[]).length).sort().slice(-(n||6));
  const cart={}, visto={}; let tudo=0;
  fech.forEach((k,i)=>(meses[k]||[]).forEach(t=>{
    if(t.t!=='d')return;
    tudo+=(+t.v||0);
    if(!cartao(t.pg))return;
    cart[t.pg]=cart[t.pg]||[];cart[t.pg][i]=(cart[t.pg][i]||0)+(+t.v||0);
    if(visto[t.pg]==null)visto[t.pg]=i;
  }));
  const med={};
  Object.keys(cart).forEach(id=>{
    const desde=visto[id], quantos=Math.max(1,fech.length-desde);
    let soma=0;for(let i=desde;i<fech.length;i++)soma+=cart[id][i]||0;
    med[id]=r2(soma/quantos);
  });
  return {ms:fech.length, cart:med, tudo:r2(fech.length?tudo/fech.length:0)};
}
function orcCartao(c,M){
  if(+c.orc>0)return r2(+c.orc);
  const disp=r2((+cfg.salario||0)-(+cfg.metaInvest||0));
  if(!(disp>0))return 0;
  M=M||mediaCartao(6);
  const meu=M.cart[c.id]||0;
  // sem histórico do cartão, reparte por igual entre os cartões: é o único
  // palpite honesto antes de haver costume
  const v=(M.tudo>0&&meu>0)?disp*(meu/M.tudo):disp/Math.max(1,cfg.cartoes.length);
  return Math.max(10,Math.round(Math.min(v,c.limite||v)/10)*10);
}
// compras feitas no cartão dentro do mês, que é o que o orçamento mede —
// a fatura é outra coisa: ela junta parcelas de compras antigas
function compradoNoMes(id,M){
  return r2((meses[M]||[]).reduce((a,t)=>a+(t.t==='d'&&t.pg===id?(+t.v||0):0),0));
}
function ritmo(M){
  const o=orcTotal(),g=resumo(M).desp,hj=hoje(),dm=diasNo(M);
  const d=M<mk(hj)?dm:M>mk(hj)?0:+hj.slice(8,10);
  return{orc:o,gasto:g,livre:r2(o-g),pMes:dm?d/dm:0,pGasto:o>0?g/o:0,dia:d,dias:dm};
}

/* ---------- blocos ---------- */
function mnav(){return `<div class="mnav"><b>${nomeMes(st.mes)}</b><span class="sp"></span>
<button onclick="mudaMes(-1)" aria-label="Mês anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<button onclick="mudaMes(1)" aria-label="Próximo mês"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div>`}
// sem orçamento não há o que estourar: barra vazia, não cheia
function barra(g,o,inv){const p=o>0?g/o:0;const c=inv?(p>=1?'ok':''):(p>1?'hot':p>.85?'warn':'');
  return `<div class="bar"><i class="${c}" style="width:${Math.min(100,p*100)}%"></i></div>`}
function linha({tx,p}){
  const rv=tx.t==='r',ap=tx.t==='a';
  const em=ap?'📈':catInfo(tx.cat).emoji;
  const nm=tx.desc||(ap?(ativo(tx.ativo)||{}).nome||'Aporte':catInfo(tx.cat).nome);
  let sub=dataBR(tx.data)+' · '+(ap?'Investimento':catInfo(tx.cat).nome)+' · '+pgNome(tx.pg);
  if(p.n>1)sub+=' · parcela '+p.i+' de '+p.n;
  return `<button class="row" onclick="detalhe('${mk(tx.data)}','${tx.id}')"><span class="ico">${em}</span>
  <span class="mid"><span class="t1">${esc(nm)}</span><span class="t2">${esc(sub)}</span></span>
  <span class="end vmid">${rv?'+':'−'}${money(p.v,rv?'up':'')}</span></button>`;
}

lanc(){
  let itens=doMes(st.mes);
  if(st.filtro)itens=itens.filter(({tx})=>tx.cat===st.filtro);
  if(st.fTipo)itens=itens.filter(({tx})=>tx.t===st.fTipo);
  if(st.fOnde)itens=itens.filter(({tx})=>st.fOnde==='_ct'?!!conta(tx.pg)
    :st.fOnde==='_cd'?!!cartao(tx.pg):tx.pg===st.fOnde);
  let h=mnav();
  const ativos=[];
  if(st.fTipo)ativos.push([{d:'Gastos',r:'Entradas',a:'Aportes'}[st.fTipo],"st.fTipo=''"]);
  if(st.fOnde)ativos.push([st.fOnde==='_ct'?'No débito':st.fOnde==='_cd'?'No crédito'
    :((conta(st.fOnde)||cartao(st.fOnde)||{}).nome||'—'),"st.fOnde=''"]);
  if(st.filtro)ativos.push([catInfo(st.filtro).emoji+' '+catInfo(st.filtro).nome,"st.filtro=''"]);
  h+=`<div class="chips">${ativos.map(([rot,zera])=>
    `<button class="btn s" onclick="${zera};render()">${esc(rot)} ✕</button>`).join('')}
    <button class="btn g s" onclick="formFiltro()">${ativos.length?'Mudar filtro':'Filtrar'}</button>
    ${ativos.length>1?`<button class="btn g s" onclick="limpaFiltros();render()">Limpar</button>`:''}</div>`;
  const btImp=`<div class="acts"><button class="btn g" onclick="document.getElementById('ext').click()">Importar extrato do banco</button></div>
  <input type="file" id="ext" style="display:none" onchange="lerExtrato(this)">`;
  if(!itens.length)return h+`<div class="grp"><div class="blank">${ativos.length?'Nada em '+nomeMes(st.mes)+' com esse filtro.<div style="margin-top:16px"><button class="btn s" onclick="limpaFiltros();render()">Limpar o filtro</button></div>':'Nada lançado em '+nomeMes(st.mes)+'.<div style="margin-top:16px"><button class="btn s" onclick="novo(\'d\')">Lançar um gasto</button></div>'}</div></div>`+btImp;
  const tot=r2(itens.reduce((s,{tx,p})=>s+(tx.t==='r'?p.v:-p.v),0));
  h+=`<div class="grp"><div class="pad" style="display:flex;align-items:baseline;padding-bottom:16px"><span class="lbl">${itens.length} ${itens.length===1?'lançamento':'lançamentos'}</span><span style="flex:1"></span><span class="vmid ${tot<0?'':'up'}">${money(tot)}</span></div></div>
  <div class="grp"><div class="rows">`+itens.map(linha).join('')+`</div></div>`+btImp;
  return h;
},

planos(){
  const M=st.mes, A=analise(M), r=A.r, nomeM=MES[+M.slice(5)-1].toLowerCase();
  const temBase=A.fech>=2&&A.normalTot>0;
  let h=mnav();

  /* ---- quanto saiu, e como isso se compara com o costume ---- */
  const dif=r2(r.desp-A.normalTot), perto=temBase&&Math.abs(dif)<Math.max(30,A.normalTot*.08);
  h+=`<div class="hero"><span class="lbl">Saiu em ${nomeM}</span>
  <span class="vbig">${money(r.desp)}</span>
  <div class="lbl" style="margin-top:12px">${
    !temBase?'Ainda não tenho meses fechados suficientes para dizer o que é normal para você.'
    :perto?'Em linha com os '+brl(A.normalTot)+' que costuma sair por mês.'
    :dif>0?'<span class="down">'+brl(dif)+' acima</span> dos '+brl(A.normalTot)+' de um mês comum seu.'
          :'<span class="up">'+brl(-dif)+' abaixo</span> dos '+brl(A.normalTot)+' de um mês comum seu.'}
  ${A.proj?' No ritmo de hoje, o mês fecha perto de <b>'+brl(A.proj)+'</b>.':''}</div>
  <div class="trio" style="margin-top:16px"><div><span class="lbl">Entrou</span><b class="up">${money(r.rec)}</b></div>
  <div><span class="lbl">Investiu</span><b>${money(r.apo)}</b></div>
  <div><span class="lbl">Sobrou</span><b class="${r.sobra<0?'down':''}">${money(r.sobra)}</b></div></div></div>`;

  /* ---- o que mudou, categoria por categoria ---- */
  const ids=[...new Set(Object.keys(r.porCat).concat(Object.keys(A.normal)))];
  const linhas=ids.map(id=>{
    const g=r2(r.porCat[id]||0), n=r2(A.normal[id]||0);
    return {id,g,n,d:r2(g-n),info:cfg.categorias.find(c=>c.id===id)||catInfo(id)};
  }).filter(x=>x.g>0||x.n>0).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
  if(linhas.length){
    h+=`<h2>O que mudou${temBase?'':' <span class="lbl" style="font-weight:400">— sem base para comparar ainda</span>'}</h2><div class="grp"><div class="rows">`;
    linhas.slice(0,8).forEach(x=>{
      const sobe=x.d>0, quieto=!temBase||Math.abs(x.d)<Math.max(10,x.n*.12);
      h+=`<button class="row" onclick="st.filtro='${x.id}';ir('lanc')"><span class="ico">${x.info.emoji||'❔'}</span>
        <span class="mid"><span class="t1">${esc(x.info.nome||'Sem categoria')}</span>
        <span class="t2">${!temBase?'primeiro registro':x.n<=0?'não aparecia nos meses anteriores':x.g<=0?'nada neste mês, contra '+brl(x.n)+' de sempre':quieto?'como de costume':
          (sobe?'R$ '+n2(x.d)+' a mais':'R$ '+n2(-x.d)+' a menos')+' que os '+brl(x.n)+' de sempre'}</span></span>
        <span class="end vmid ${quieto?'':sobe?'down':'up'}">${money(x.g)}</span></button>`});
    h+=`</div></div>`;
  }

  /* ---- alertas: só o que destoa de verdade ---- */
  const avisos=[];
  linhas.forEach(x=>{
    if(!temBase||x.n<=0||x.g<60||x.d<40)return;
    if(x.g>x.n*1.6)avisos.push({t:(x.info.emoji||'❔')+' '+(x.info.nome||'Sem categoria'),
      m:'está em '+brl(x.g)+', '+Math.round((x.g/x.n-1)*100)+'% acima dos '+brl(x.n)+' de sempre.'});
  });
  const gastos=doMes(M).filter(({tx})=>tx.t==='d').sort((a,b)=>b.p.v-a.p.v);
  if(gastos.length&&r.desp>0){
    const maior=gastos[0];
    if(maior.p.v>r.desp*.3&&maior.p.v>100)avisos.push({t:'🔎 Um gasto puxou o mês',
      m:brl(maior.p.v)+' em "'+(maior.tx.desc||catInfo(maior.tx.cat).nome)+'" representa '+Math.round(maior.p.v/r.desp*100)+'% de tudo que saiu.'});
  }
  if(r.rec>0&&r.apo>=0){
    const taxa=Math.round(r.apo/r.rec*100);
    if(taxa<20&&r.rec>500)avisos.push({t:'📉 Guardou pouco neste mês',
      m:'De '+brl(r.rec)+' que entraram, '+brl(r.apo)+' viraram investimento — '+taxa+'%.'});
  }
  avisos.slice(0,3).forEach(a=>{h+=`<div class="note" style="border-left-color:var(--warn)"><b>${esc(a.t)}</b>${esc(a.m)}</div>`});

  /* ---- os maiores gastos, que é onde se mexe primeiro ---- */
  if(gastos.length){
    h+=`<h2>Maiores gastos de ${nomeM}</h2><div class="grp"><div class="rows">`;
    gastos.slice(0,6).forEach(({tx,p})=>{
      const ci=cfg.categorias.find(c=>c.id===tx.cat)||catInfo(tx.cat);
      h+=`<button class="row" onclick="st.filtro='';ir('lanc')"><span class="ico">${ci.emoji||'❔'}</span>
        <span class="mid"><span class="t1">${esc(tx.desc||ci.nome||'Lançamento')}</span>
        <span class="t2">${dataBR(tx.data)} · ${esc(ci.nome||'')}${p.n>1?' · parcela '+p.i+' de '+p.n:''}</span></span>
        <span class="end vmid">${money(p.v)}</span></button>`});
    h+=`</div></div>`;
  }

  /* ---- os seis meses, para ver a linha e não só o ponto ---- */
  h+=`<h2>Últimos seis meses</h2><div class="grp"><div class="pad">${grafico()}</div></div>`;

  /* ---- plano do salário, agora como contexto e não como abertura ---- */
  const o=orcTotal(),sobraP=r2(cfg.salario-o-cfg.metaInvest);
  if(cfg.salario>0){
    const fG=pct(o,cfg.salario),fI=pct(cfg.metaInvest,cfg.salario),fS=pct(Math.max(0,sobraP),cfg.salario);
    h+=`<h2>Plano do salário<span class="sp"></span><a onclick="abrirAjustes()">editar</a></h2>
    <div class="panel"><div style="display:flex;align-items:baseline"><span class="lbl">Salário</span><span style="flex:1"></span><span class="vmid">${money(cfg.salario)}</span></div>
    <div class="split" style="height:14px;margin-top:12px">
      <i style="width:${fG}%;background:var(--acc)"></i><i style="width:${fI}%;background:var(--up)"></i><i style="width:${fS}%;background:var(--line2)"></i></div>
    <div class="plin"><span class="pb" style="background:var(--acc)"></span><span>Gastos planejados</span><span class="sp2"></span><span class="n">${money(o)}</span><span class="lbl pp">${Math.round(fG)}%</span></div>
    <div class="plin"><span class="pb" style="background:var(--up)"></span><span>Investir</span><span class="sp2"></span><span class="n">${money(cfg.metaInvest)}</span><span class="lbl pp">${Math.round(fI)}%</span></div>
    <div class="plin"><span class="pb" style="background:var(--line2)"></span><span>Folga</span><span class="sp2"></span><span class="n ${sobraP<0?'down':''}">${money(sobraP)}</span><span class="lbl pp">${Math.round(fS)}%</span></div>
    ${sobraP<0?`<p class="hint" style="padding-left:0">O plano não fecha: gastos e meta somam ${brl(o+cfg.metaInvest)}, mais do que o salário.</p>`
     :sobraP>0&&totalCartoes()>0?`<p class="hint" style="padding-left:0">A folga de ${brl(sobraP)} por mês zera os ${brl(totalCartoes())} de cartão em cerca de ${Math.ceil(totalCartoes()/sobraP)} meses.</p>`:''}</div>`;
  }

  /* ---- orçamento, para quem quiser teto por categoria ---- */
  const cats=[...cfg.categorias];Object.keys(r.porCat).forEach(id=>{if(!cats.find(c=>c.id===id))cats.push({id,...catInfo(id),orc:0})});
  const vis=cats.filter(c=>(+c.orc||0)>0);
  h+=`<h2>Tetos por categoria<span class="sp"></span><a onclick="formOrcAuto()">calcular</a><span style="width:14px;display:inline-block"></span><a onclick="abrirAjustes()">editar</a></h2>`;
  if(!vis.length)h+=`<div class="grp"><div class="blank">Nenhum teto definido. Sem eles, esta tela ainda compara seus meses — o teto só acrescenta um limite.<div style="margin-top:16px"><button class="btn s" onclick="formOrcAuto()">Calcular para mim</button></div></div></div>`;
  else{
    const comOrc=vis.map(c=>({o:+c.orc,g:r2(r.porCat[c.id]||0)}));
    const folga=r2(comOrc.reduce((s,x)=>s+Math.max(0,x.o-x.g),0));
    const excesso=r2(comOrc.reduce((s,x)=>s+Math.max(0,x.g-x.o),0));
    const coberto=excesso>0&&excesso<=folga, livre=r2(folga-excesso);
    h+=`<div class="note" style="border-left-color:var(--${excesso>folga?'bad':coberto?'warn':'up'})">
      <b>${excesso>folga?'Faltam '+brl(r2(excesso-folga)):coberto?brl(excesso)+' cobertos pela sobra':'Sobra livre: '+brl(livre)}</b>
      ${excesso>folga?'Mesmo usando o que sobrou nas outras categorias, o mês não fecha.'
        :coberto?'Algumas passaram do teto, mas outras gastaram menos. Ainda sobram '+brl(livre)+' para o resto do mês.'
        :'O que não for gasto numa categoria pode ir para qualquer outra.'}</div><div class="grp">`;
    vis.forEach(c=>{const g=r2(r.porCat[c.id]||0),oc=+c.orc||0,resta=r2(oc-g);
      h+=`<div class="env" onclick="st.filtro='${c.id}';ir('lanc')"><div class="top"><span class="nm">${c.emoji} ${esc(c.nome)}</span><span class="vmid">${money(g)}</span><span class="lbl">de ${brl(oc)}</span></div>
      ${barra(g,oc)}<div class="sub">${resta>=0?'Resta '+brl(resta):
        coberto?'Passou '+brl(-resta)+', coberto pela sobra das outras'
               :'<span class="down">Passou '+brl(-resta)+' do teto</span>'}</div></div>`});
    h+=`</div>`;
  }

  /* ---- objetivos ---- */
  h+=`<h2>Objetivos<span class="sp"></span><a onclick="formObj()">novo objetivo</a></h2>`;
  if(!cfg.objetivos.length)h+=`<div class="grp"><div class="blank">Sem objetivos ainda.</div></div>`;
  cfg.objetivos.forEach(ob=>{const falta=r2(Math.max(0,ob.alvo-ob.guardado));let rit='';
    if(ob.prazo&&falta>0){const n=Math.max(1,difM(mk(hoje()),ob.prazo));rit=` Guardando ${brl(falta/n)} por mês, você chega lá em ${curtoMes(ob.prazo)}.`}
    h+=`<div class="panel"><div style="display:flex;align-items:baseline;gap:8px"><span class="ico">${esc(ob.emoji||'🎯')}</span>
    <span style="flex:1"><b style="font-weight:600">${esc(ob.nome)}</b><div class="lbl">${brl(ob.guardado)} de ${brl(ob.alvo)}</div></span>
    <span class="vmid">${Math.round(pct(ob.guardado,ob.alvo))}%</span></div>
    ${barra(ob.guardado,ob.alvo,1)}<div class="lbl" style="margin-top:8px">${falta>0?'Faltam '+brl(falta)+'.':'Objetivo atingido.'}${rit}</div>
    <div class="acts"><button class="btn s" onclick="formGuardar('${ob.id}')">Guardar ou retirar</button><button class="btn g s" onclick="formObj('${ob.id}')">Editar</button></div></div>`});
  return h;
}};

function grafico(){
  const ms=[];for(let i=5;i>=0;i--)ms.push(addM(st.mes,-i));
  const d=ms.map(resumo),pico=Math.max(...d.map(x=>Math.max(x.rec,x.desp)));
  if(pico<=0)return `<div class="blank" style="padding:18px 6px">Sem lançamentos nos últimos seis meses.<br>O gráfico aparece assim que você registrar o primeiro.</div>`;
  const mx=Math.max(1,pico);
  const W=318,H=108,bw=15,gap=3,step=W/6;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H+22}" width="100%" role="img" aria-label="Entradas e gastos dos últimos seis meses">`;
  ms.forEach((m,i)=>{const cx=i*step+step/2,hr=Math.max(d[i].rec?2:0,d[i].rec/mx*H),hd=Math.max(d[i].desp?2:0,d[i].desp/mx*H);
    s+=`<rect x="${cx-bw-gap/2}" y="${H-hr}" width="${bw}" height="${hr}" rx="3" fill="var(--up)"><title>${curtoMes(m)}: entrou ${brl(d[i].rec)}</title></rect>
    <rect x="${cx+gap/2}" y="${H-hd}" width="${bw}" height="${hd}" rx="3" fill="var(--acc)"><title>${curtoMes(m)}: gastou ${brl(d[i].desp)}</title></rect>
    <text x="${cx}" y="${H+15}" text-anchor="middle">${curtoMes(m)}</text>`});
  return s+`</svg><div class="lbl" style="display:flex;gap:16px;justify-content:center;margin-top:4px">
  <span><span style="color:var(--up)">■</span> entrou</span><span><span style="color:var(--acc)">■</span> gastou</span></div>`;
}

function diaUtilDoFim(k,ordem){ // 1 = último dia útil, 2 = penúltimo...
  const [y,m]=k.split('-').map(Number);
  const d=new Date(y,m-1,diasNo(k)); let n=0;
  while(d.getMonth()===m-1){
    const w=d.getDay();
    if(w!==0&&w!==6){n++;if(n===ordem)return k+'-'+p2(d.getDate())}
    d.setDate(d.getDate()-1);
  }
  return k+'-'+p2(diasNo(k));
}
function dataSalario(k){
  const q=cfg.salarioQuando||'pu';
  if(q==='pu')return diaUtilDoFim(k,2);
  if(q==='u')return diaUtilDoFim(k,1);
  return k+'-'+p2(Math.min(parseInt(q)||5,diasNo(k)));
}

}

function mudaMes(n){st.mes=addM(st.mes,n);render()}
$('#main').addEventListener('scroll',function(){$('#hd').classList.toggle('stuck',this.scrollTop>6)},{passive:true});
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}
function abrir(h){$('#sheet').innerHTML='<div class="handle"></div>'+h;$('#ov').classList.add('on')}
function fechar(){$('#ov').classList.remove('on')}
const cab=t=>`<h3>${t}<span class="sp"></span><button class="icbtn" onclick="fechar()" aria-label="Fechar"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3>`;
const val=id=>($('#'+id)||{}).value;

/* ---------- lançar ---------- */
let fl={};
const contaPadrao=()=>(cfg.contas[0]||{}).id||'conta';
function novo(t,a){

  fl={t,ativo:a||(cfg.ativos[0]||{}).id,v:'',desc:'',data:hoje(),jaSaiu:!!cfg.bancos.length,

/**
 * Editar é o mesmo formulário com os campos preenchidos. Aporte fica de
 * fora: ele mexeu na posição e no preço médio quando foi lançado, e refazer
 * essa conta ao contrário é errar de um jeito difícil de perceber.
 */
function editaLanc(k,id){
  const tx=(meses[k]||[]).find(x=>x.id===id); if(!tx)return;
  if(tx.t==='a')return toast('Aporte não se edita: exclua e lance de novo');
  fl={t:tx.t,ativo:(cfg.ativos[0]||{}).id,v:n2(tx.v),desc:tx.desc||'',data:tx.data,
      pg:tx.pg,cat:tx.cat||'',parc:tx.parc||1,q:'',pu:'',jaSaiu:false,
      edit:{k,id,idTx:tx.idTx}};
  formLanc();
}
function guardaForm(){['v','desc','data','pg','cat','parc','ativo','q','pu'].forEach(k=>{const e=$('#f_'+k);if(e)fl[k]=e.value})}
function alternaJaSaiu(){guardaForm();fl.jaSaiu=!fl.jaSaiu;formLanc()}
function setTipo(t){guardaForm();fl.t=t;if(t!=='d'&&cartao(fl.pg))fl.pg=contaPadrao();fl.cat='';formLanc()}
function formLanc(){
  const t=fl.t,cats=t==='r'?RECS:cfg.categorias;
  const ctas=cfg.contas.map(c=>({id:c.id,n:c.emoji+' '+c.nome}));
  const pgs=t==='d'?[...cfg.cartoes.map(c=>({id:c.id,n:'💳 '+c.nome})),...ctas]:ctas;
  const a=t==='a'?ativo(fl.ativo):null, erv=a&&a.rv;
  const tipos=fl.edit?[['d','Gasto'],['r','Entrada']]:[['d','Gasto'],['r','Entrada'],['a','Investir']];
  let h=cab(fl.edit?'Editar lançamento':'Novo lançamento')+`<div class="seg">${tipos.map(([k,n])=>`<button class="${t===k?'on':''}" onclick="setTipo('${k}')">${n}</button>`).join('')}</div>`;
  if(t==='a'&&!cfg.ativos.length)return abrir(h+`<div class="blank">Cadastre um investimento primeiro.<div style="margin-top:16px"><button class="btn s" onclick="fechar();formAtivo()">Adicionar investimento</button></div></div>`);
  if(t==='a')h+=`<label>Onde você investiu</label><select id="f_ativo" onchange="guardaForm();formLanc()">${cfg.ativos.map(x=>`<option value="${x.id}" ${fl.ativo===x.id?'selected':''}>${esc(x.nome)}</option>`).join('')}</select>`;
  if(erv){
    const q=num(fl.q)||0,pu=num(fl.pu)||0;
    h+=`<div class="two"><div><label>Quantas cotas</label><input id="f_q" inputmode="decimal" placeholder="0" value="${esc(fl.q)}" oninput="guardaForm();atualizaTotal()"></div>
    <div><label>Preço por cota</label><input id="f_pu" inputmode="decimal" placeholder="${a.cot?n2(a.cot):'0,00'}" value="${esc(fl.pu)}" oninput="guardaForm();atualizaTotal()"></div></div>
    <p class="hint" id="f_tot" style="padding-top:10px">${q&&pu?'Total de '+brl(q*pu)+'. Seu preço médio passa a ser '+brl((custoAtivo(a)+q*pu)/((+a.qtd||0)+q))+'.':'O total e o novo preço médio aparecem aqui.'}</p>`;
  }else{
    h+=`<label>Valor</label><input id="f_v" class="big" inputmode="decimal" placeholder="0,00" value="${esc(fl.v)}">`;
    if(t!=='a')h+=`<label>Categoria</label><select id="f_cat">${cats.map(c=>`<option value="${c.id}" ${fl.cat===c.id?'selected':''}>${c.emoji} ${esc(c.nome)}</option>`).join('')}</select>`;
  }
  h+=`<label>Descrição, se quiser</label><input id="f_desc" placeholder="${t==='d'?'posto, iFood, cinema':t==='r'?'salário de novembro':'aporte mensal'}" value="${esc(fl.desc)}">
  <div class="two"><div><label>${t==='r'?'Caiu em':'Saiu de'}</label><select id="f_pg" onchange="guardaForm();formLanc()">${pgs.map(p=>`<option value="${p.id}" ${fl.pg===p.id?'selected':''}>${p.n}</option>`).join('')}</select></div>
  <div><label>Data</label><input id="f_data" type="date" value="${esc(fl.data)}"></div></div>`;
  if(t==='a'&&cfg.bancos.length)h+=`<div class="ilin" style="border-bottom:0;margin-top:4px" onclick="alternaJaSaiu()">
    <button class="ick" style="${fl.jaSaiu?'':'background:none;border-color:var(--line2)'}">${fl.jaSaiu?'✓':''}</button>
    <div class="imid"><div class="t1">O banco já sabe deste aporte</div>
    <div class="t2">A conta já foi descontada e o dinheiro já está na posição que vem da corretora. Marcado, ele conta no investido do mês sem mexer no saldo nem no total aplicado.</div></div></div>`;
  if(t==='d'&&cartao(fl.pg))h+=`<label>Parcelas</label><select id="f_parc">${Array.from({length:18},(_,i)=>`<option value="${i+1}" ${+fl.parc===i+1?'selected':''}>${i===0?'À vista':(i+1)+'x'}</option>`).join('')}</select>`;
  h+=`<div class="acts fim">${fl.edit?`<button class="btn d" onclick="excluir('${fl.edit.k}','${fl.edit.id}')">Excluir</button>`:''}<button class="btn" onclick="salvarLanc()">Salvar</button></div>`;
  abrir(h);
  setTimeout(()=>{const e=$('#f_v')||$('#f_q');if(e&&!e.value)e.focus()},60);

function atualizaTotal(){const a=ativo(fl.ativo),q=num(fl.q)||0,pu=num(fl.pu)||0,e=$('#f_tot');if(!e||!a)return;
  e.innerHTML=q&&pu?'Total de '+brl(q*pu)+'. Seu preço médio passa a ser '+brl((custoAtivo(a)+q*pu)/((+a.qtd||0)+q))+'.':'O total e o novo preço médio aparecem aqui.'}
function salvarLanc(){
  guardaForm();
  const a=fl.t==='a'?ativo(fl.ativo):null, erv=a&&a.rv;
  let v;
  if(erv){const q=num(fl.q),pu=num(fl.pu);
    if(!(q>0)||!(pu>0))return toast('Preencha quantas cotas e o preço');
    v=r2(q*pu);}
  else{v=r2(num(fl.v));if(!(v>0))return toast('Digite um valor válido')}
  if(!fl.data)return toast('Escolha a data');
  const tx={id:uid(),t:fl.t,v,desc:(fl.desc||'').trim(),pg:fl.pg,data:fl.data};
  if(fl.t==='a'){if(!a)return toast('Escolha o investimento');tx.ativo=a.id}else tx.cat=fl.cat||(fl.t==='r'?'extra':'outros');
  if(fl.t==='d'&&cartao(fl.pg))tx.parc=+fl.parc||1;
  const k=mk(tx.data);
  if(fl.edit){
    const ant=fl.edit;
    tx.id=ant.id;
    // o identificador acompanha: reenviar o comprovante depois ainda encontra
    // este lançamento em vez de criar outro
    if(ant.idTx)tx.idTx=ant.idTx;
    meses[ant.k]=(meses[ant.k]||[]).filter(x=>x.id!==ant.id);
    meses[k]=(meses[k]||[]).concat(tx);
    if(ant.k!==k)salvarMes(ant.k);
    salvarMes(k);fl.edit=null;fechar();render();
    return toast('Lançamento alterado');
  }
  meses[k]=(meses[k]||[]).concat(tx);
  // o banco já reflete os dois lados: o dinheiro saiu da conta e entrou na
  // posição. Registrar aqui serve ao investido do mês, não ao patrimônio.
  const jaLa=fl.t==='a'&&fl.jaSaiu;
  if(jaLa){const c=conta(fl.pg);if(c)c.saldo=r2((+c.saldo||0)+v);tx.js=1}
  if(a&&!jaLa){
    if(erv){const q=num(fl.q),nq=r4((+a.qtd||0)+q);a.pm=r4((custoAtivo(a)+v)/nq);a.qtd=nq;if(!a.cot)a.cot=num(fl.pu);tx.q=q}
    else a.atual=r2((+a.atual||0)+v);
    gravar('fin/config',cfg);
  }
  if(jaLa&&erv)tx.q=num(fl.q); // guarda as cotas do aporte sem mexer na posição
  salvarMes(k);fechar();
  toast(tx.parc>1?`Lançado em ${tx.parc}x de ${brl(v/tx.parc)}`:'Lançado');
}
function lancarSalario(){
  const k=st.mes,d=dataSalario(k);
  meses[k]=(meses[k]||[]).concat({id:uid(),t:'r',v:cfg.salario,desc:'Salário',cat:'salario',pg:contaPadrao(),data:d});
  salvarMes(k);toast('Salário lançado em '+dataBR(d));
}
function detalhe(k,id){
  const tx=(meses[k]||[]).find(x=>x.id===id);if(!tx)return;
  const c=catInfo(tx.cat),a=tx.ativo?ativo(tx.ativo):null;
  let sub=(tx.t==='r'?'Entrada':tx.t==='a'?'Investimento':'Gasto')+' em '+pgNome(tx.pg)+', dia '+dataBR(tx.data)+'/'+tx.data.slice(0,4);
  if(tx.t!=='a')sub=c.emoji+' '+c.nome+' · '+sub;
  if(tx.parc>1)sub+=' · '+tx.parc+'x de '+brl(tx.v/tx.parc);
  if(a&&tx.q)sub+=' · '+tx.q+' cotas de '+esc(a.nome);
  abrir(cab(esc(tx.desc||(a?a.nome:c.nome)))+`<span class="vbig">${money(tx.v)}</span>
  <p class="hint" style="padding-left:0;margin-top:6px">${sub}</p>
  <div class="acts fim"><button class="btn d" onclick="excluir('${k}','${id}')">Excluir</button>${tx.t==='a'?'':`<button class="btn" onclick="editaLanc('${k}','${id}')">Editar</button>`}</div>`);
}
function excluir(k,id){
  const tx=(meses[k]||[]).find(x=>x.id===id);if(!tx)return;
  meses[k]=meses[k].filter(x=>x.id!==id);
  const a=tx.ativo?ativo(tx.ativo):null;
  if(a){ if(a.rv&&tx.q){const nq=r4((+a.qtd||0)-tx.q); if(nq>0){a.pm=r4((custoAtivo(a)-tx.v)/nq);a.qtd=nq}else{a.qtd=0;a.pm=0} }
    else if(!a.rv)a.atual=r2((+a.atual||0)-tx.v);
    gravar('fin/config',cfg)}
  salvarMes(k);fechar();toast('Excluído');
}
function pagarFatura(cid,F){
  const c=cartao(cid),k=pagaKey(c,F);
  if(cfg.faturasPagas[k]){delete cfg.faturasPagas[k];salvarCfg();return toast('Desfeito')}
  const v=r2(faturas(c)[F]||0), venc=vencISO(c,F), passado=venc<hoje();
  pg={cid,F,v,data:venc,conta:c.conta,manter:passado};
  formPagar();
}
let pg=null;
function lePagar(){['conta','data'].forEach(x=>{const e=$('#pf_'+x);if(e)pg[x]=e.value})}
function formPagar(){
  const c=cartao(pg.cid), antes=saldoConta(pg.conta), depois=r2(antes-(pg.manter?0:pg.v));
  abrir(cab('Pagar a fatura de '+curtoMes(mesVenc(c,pg.F)))+
  `<span class="vbig">${money(pg.v)}</span>
  <p class="hint" style="padding-left:0;margin-top:6px">${esc(c.nome)}, vence ${venceData(c,pg.F)}.</p>
  <div class="two"><div><label>Saiu de</label><select id="pf_conta" onchange="lePagar();formPagar()">${cfg.contas.map(x=>`<option value="${x.id}" ${x.id===pg.conta?'selected':''}>${x.emoji} ${esc(x.nome)}</option>`).join('')}</select></div>
  <div><label>Em que dia</label><input id="pf_data" type="date" value="${esc(pg.data)}" onchange="lePagar();formPagar()"></div></div>
  <div class="ilin" style="border-bottom:0;margin-top:14px" onclick="lePagar();pg.manter=!pg.manter;formPagar()">
    <button class="ick" style="${pg.manter?'':'background:none;border-color:var(--line2)'}">${pg.manter?'✓':''}</button>
    <div class="imid"><div class="t1">Esse pagamento já está no saldo da conta</div>

// as regras do usuário vêm primeiro: só ele sabe que um Pix para fulano é
// a mensalidade da faculdade. Ficam no aparelho, nunca no código.
function regraDe(desc,v){
  const d=semAcento(String(desc||''));
  for(const r of (cfg.regras||[])){
    if(!r.txt)continue;
    if(!d.includes(semAcento(r.txt)))continue;
    if(r.v>0&&Math.abs(Math.abs(+v||0)-r.v)>0.005)continue;
    if(cfg.categorias.some(c=>c.id===r.cat))return r.cat;
  }
  return '';
}
function categorizar(desc,ehEntrada,v){
  const minha=ehEntrada?'':regraDe(desc,v);
  if(minha)return minha;
  if(ehEntrada)return /sal[aá]rio|salario|remunera|folha|proventos/i.test(desc)?'salario':'extra';
  for(const r of REGRAS) if(r.re.test(desc))
    for(const id of r.ids) if(cfg.categorias.some(c=>c.id===id)) return id;
  return (cfg.categorias.find(c=>c.id==='outros')||cfg.categorias[cfg.categorias.length-1]||{}).id||'outros';
}
const limpaDesc=d=>String(d||'').replace(/\s+/g,' ')

const chaveTx=t=>t.fit?('f:'+t.fit):('h:'+t.data+'|'+t.v.toFixed(2)+'|'+limpaDesc(t.desc).toLowerCase().slice(0,24));

function parseOFX(txt){
  const out=[];
  const blocos=txt.split(/<STMTTRN>/i).slice(1);
  for(const b of blocos){
    const g=t=>{const m=new RegExp('<'+t+'>([^<\\r\\n]*)','i').exec(b);return m?m[1].trim():''};
    const dt=g('DTPOSTED')||g('DTAVAIL'), amt=g('TRNAMT');
    if(!dt||!amt)continue;
    const d=dt.replace(/[^0-9]/g,'');
    if(d.length<8)continue;
    const v=parseFloat(amt.replace(/\./g,m=>'.').replace(',','.'));
    if(!isFinite(v)||v===0)continue;
    out.push({data:d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8),v,
      desc:limpaDesc(g('NAME')||g('MEMO')),memo:g('MEMO'),fit:g('FITID')});
  }
  return out;
}
function dicasOFX(txt){
  const org=(/<ORG>([^<\r\n]*)/i.exec(txt)||[])[1]||'';
  const cartao=/<CREDITCARDMSGSRSV1|<CCACCTFROM/i.test(txt);
  const bal=(/<LEDGERBAL>[\s\S]*?<BALAMT>([^<\r\n]*)/i.exec(txt)||[])[1];
  const v=bal!=null?numBR(bal):NaN;
  return {org:org.trim(),cartao,saldo:isFinite(v)?v:null};
}
// o que não é gasto nem receita: transferências entre as suas próprias contas
const semAcento=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function ehVoce(desc){
  const n=semAcento(cfg.nome).replace(/\s+/g,' ').trim();
  if(n.length<6)return false;
  const d=semAcento(desc);
  if(d.includes(n))return true;
  // "Joao Victor Santos" x "Joao Victor Gabriel dos Santos": primeiro e último nome bastam
  const ps=n.split(' ').filter(x=>x.length>2);
  if(ps.length<2)return false;
  return d.includes(ps[0])&&d.includes(ps[ps.length-1]);
}
function natureza(desc){
  const d=String(desc||'');
  if(ehVoce(d))return 'transferencia';
  // num cartão, o pagamento da própria fatura chega junto com as compras e
  // tem o valor da fatura inteira: entrar como gasto dobraria o mês
  if(/pagamento.*fatura|fatura.*cart|fatura picpay|fatura inter/i.test(d))return 'fatura';
  if(/pagamento\s*(on\s*line|efetuado|recebido)|\bpagto\b|amortiza[çc]|ajuste a cr[ée]dito|\bvl fat\b|\bpg ent\b|\bvalor pst\b|estorno/i.test(d))return 'fatura';
  if(/aplica[çc][aã]o|resgate|resgatad|\bcdb\b|tesouro|nota bov|d[ée]bito b3|porq obj|cofrinho/i.test(d))return 'investimento';
  if(/cr[ée]dito liberado|pix no cr[ée]dito/i.test(d))return 'credito';
  return '';
}
const ROTULO={fatura:'pagamento de fatura',investimento:'aplicação ou resgate',credito:'crédito liberado',transferencia:'transferência entre suas contas'};
// como a compra foi paga, quando o banco conta
function metodo(t){
  const d=(t.memo||'')+' '+(t.desc||'');
  if(/pix/i.test(d))return 'Pix';
  if(/compra no d[ée]bito|d[ée]bito em conta|cart[aã]o de d[ée]bito|com saldo/i.test(d))return 'débito';
  if(/cr[ée]dito debitado|no cr[ée]dito|cart[aã]o de cr[ée]dito/i.test(d))return 'crédito';
  if(/boleto|t[ií]tulo/i.test(d))return 'boleto';
  if(/compra realizada/i.test(d))return 'débito';
  return '';
}
// qual cartão a descrição cita
function cartaoNoTexto(d){
  const t=String(d||'').toLowerCase();
  return cfg.cartoes.find(c=>c.nome.length>=3&&t.includes(c.nome.toLowerCase()))||null;
}
// qual fatura em aberto esse pagamento quita: valor igual manda, senão a data mais próxima
function achaFatura(c,data,valor){
  const f=faturas(c), cands=[];
  for(const F in f){
    if(f[F]<=0.004||paga(c,F))continue;
    const mv=mesVenc(c,F), venc=mv+'-'+p2(Math.min(c.vence,diasNo(mv)));
    cands.push({F,dias:Math.abs((new Date(venc)-new Date(data))/86400000),dv:Math.abs(f[F]-valor)});
  }
  if(!cands.length)return null;
  cands.sort((a,b)=>((a.dv<0.01?0:1)-(b.dv<0.01?0:1))||a.dias-b.dias);
  const m=cands[0];
  return (m.dv<0.01||m.dias<=25)?m.F:null;
}
function numBR(x){
  // bancos usam − (U+2212) e – no lugar do hífen, e espaço fino antes do valor
  let t=String(x||'').replace(/[\u2212\u2013\u2014]/g,'-')
        .replace(/["']/g,'').replace(/R\$|\s|\u00a0|\u202f/g,'').trim();
  if(!t)return NaN;
  const neg=/^-/.test(t)||/\)$/.test(t); t=t.replace(/[()\-]/g,'');
  if(/,\d{1,2}$/.test(t)) t=t.replace(/\./g,'').replace(',','.');
  else t=t.replace(/,/g,'');
  const v=parseFloat(t); return isFinite(v)?(neg?-v:v):NaN;
}
function dataBRtoISO(x){
  const t=String(x||'').trim();
  let m=/^(\d{4})-(\d{2})-(\d{2})/.exec(t); if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/.exec(t);
  if(m){let a=m[3];if(a.length===2)a='20'+a;return a+'-'+p2(+m[1]>12?+m[2]:+m[2])+'-'+p2(m[1])}
  return '';
}
function parseCSV(txt){
  const linhas=txt.split(/\r?\n/).filter(l=>l.trim());
  if(!linhas.length)return [];
  const sep=[';','\t',','].map(c=>({c,n:linhas.slice(0,8).reduce((a,l)=>a+l.split(c).length-1,0)}))
    .sort((a,b)=>b.n-a.n)[0].c;
  const corta=l=>{const r=[];let cur='',asp=false;
    for(const ch of l){if(ch==='"'){asp=!asp}else if(ch===sep&&!asp){r.push(cur);cur=''}else cur+=ch}
    r.push(cur);return r.map(x=>x.trim())};
  const linhasCort=linhas.map(corta);
  // acha o cabeçalho, que pode vir depois de linhas de metadados
  let iCab=-1;
  for(let i=0;i<Math.min(linhasCort.length,20);i++){
    const c=linhasCort[i].map(x=>x.toLowerCase());
    if(c.some(x=>/^data|^date|lan[çc]amento/.test(x))&&c.some(x=>/valor|amount|cr[ée]d|d[ée]b|entrada|sa[ií]da/.test(x))){iCab=i;break}
  }
  const cab=iCab>=0?linhasCort[iCab].map(x=>x.toLowerCase()):null;
  const corpo=linhasCort.slice(iCab>=0?iCab+1:0).filter(r=>r.length>=2&&r.some(x=>x));
  if(!corpo.length)return [];
  const nc=Math.max(...corpo.map(r=>r.length));
  const col=j=>corpo.map(r=>r[j]||'');
  const ehHora=v=>/^\d{1,2}:\d{2}(:\d{2})?$/.test(String(v).trim());
  const ehData=v=>!!dataBRtoISO(v);
  const soNumero=v=>/^[-+R$\s\d.,()]*$/.test(String(v));

  // coluna de data: a que mais linhas conseguem virar data
  let iData=-1,mD=0;
  for(let j=0;j<nc;j++){const n=col(j).filter(ehData).length;if(n>mD){mD=n;iData=j}}
  if(mD===0)return [];

  // coluna de valor: numérica, com centavos; cabeçalho decide em caso de empate,
  // senão a mais à esquerda, porque "saldo" costuma vir depois de "valor"
  let iVal=-1,mV=-1;
  for(let j=0;j<nc;j++){
    if(j===iData)continue;
    const v=col(j);
    const nums=v.filter(x=>x&&isFinite(numBR(x))&&/\d/.test(x)&&!ehHora(x)&&!ehData(x)).length;
    if(!nums)continue;
    const cent=v.filter(x=>/[.,]\d{2}\s*$/.test(x)).length;
    const nome=cab?(cab[j]||''):'';
    let peso=nums+cent;
    if(/valor|amount|montante/.test(nome))peso+=1000;
    if(/saldo|balance|limite|acumul/.test(nome))peso-=2000;
    peso-=j; // desempata pela mais à esquerda
    if(peso>mV){mV=peso;iVal=j}
  }
  if(iVal<0)return [];

  // coluna de descrição: a com mais letras de verdade, nunca hora nem data
  let iTxt=-1,mT=0;
  for(let j=0;j<nc;j++){
    if(j===iData||j===iVal)continue;
    let pt=0;
    for(const x of col(j)){
      const t=String(x).trim();
      if(!t||ehHora(t)||ehData(t)||soNumero(t))continue;
      pt+=(t.match(/[A-Za-zÀ-ÿ]/g)||[]).length;
    }
    const nome=cab?(cab[j]||''):'';
    if(/descri|hist[oó]ric|t[ií]tulo|title|estabelec|memo|detalhe|lan[çc]amento/.test(nome))pt+=5000;
    if(pt>mT){mT=pt;iTxt=j}
  }

  // coluna que diz o sentido, quando o valor vem sem sinal
  let iTipo=-1;
  for(let j=0;j<nc;j++){
    if(j===iData||j===iVal||j===iTxt)continue;
    const n=col(j).filter(x=>/^(d[ée]bito|cr[ée]dito|entrada|sa[ií]da|debit|credit|[-+])$/i.test(String(x).trim())).length;
    if(n>corpo.length*0.5){iTipo=j;break}
  }

  const out=[];
  for(const r of corpo){
    const data=dataBRtoISO(r[iData]); if(!data)continue;
    let v=numBR(r[iVal]); if(!isFinite(v)||v===0)continue;
    if(iTipo>=0&&/^(d[ée]bito|sa[ií]da|debit|-)$/i.test(String(r[iTipo]).trim()))v=-Math.abs(v);
    else if(iTipo>=0)v=Math.abs(v);
    out.push({data,v,desc:limpaDesc(iTxt>=0?r[iTxt]:''),fit:''});
  }
  return out;
}
let imp=null, sincronizando=false;
function lerExtrato(inp){
  const f=inp.files&&inp.files[0]; if(!f)return;
  inp.value='';
  if(/\.pdf$/i.test(f.name||'')||f.type==='application/pdf')return lerFaturaPDF(f);
  const ler=cod=>new Promise((ok,erro)=>{
    const fr=new FileReader(); fr.onerror=erro;
    fr.onload=()=>ok(String(fr.result||'')); fr.readAsText(f,cod);
  });
  ler('UTF-8').then(t=>{
    // acentos quebrados indicam arquivo em Latin-1; relê com a outra tabela
    return /\uFFFD/.test(t)?ler('windows-1252'):t;
  }).then(txt=>{
    if(txt.charCodeAt(0)===0xFEFF)txt=txt.slice(1); // marca de ordem de bytes
    const ehOFX=/<STMTTRN>/i.test(txt);
    const itens=ehOFX?parseOFX(txt):parseCSV(txt);
    if(!itens.length)return toast('Não encontrei lançamentos nesse arquivo');
    itens.sort((a,b)=>a.data.localeCompare(b.data));
    const dicas=ehOFX?dicasOFX(txt):{org:pescaBanco(txt),cartao:false,saldo:null};
    imp={pg:destinoProvavel(dicas), inv:false, saldo:dicas.saldo, ajusta:dicas.saldo!=null, itens:itens.map(t=>{
      const k=chaveTx(t), nat=natureza(t.desc), dup=todos().some(x=>x.k===k);
      let quita=null;
      if(nat==='fatura'&&t.v<0){
        const c=cartaoNoTexto((t.memo||'')+' '+t.desc)||(cfg.cartoes.length===1?cfg.cartoes[0]:null);
        const F=c?achaFatura(c,t.data,Math.abs(t.v)):null;
        if(c&&F)quita={cid:c.id,F};
      }
      return {...t,k,dup,nat,quita,met:metodo(t),usar:!dup&&(!nat||!!quita),cat:categorizar(t.desc,t.v>0,t.v)};
    })};
    formImportar();
  }).catch(()=>toast('Não deu para abrir o arquivo'));
}
function pescaBanco(txt){
  // procura o nome de alguma conta ou cartão no corpo do arquivo
  const t=txt.slice(0,20000).toLowerCase();
  const nomes=[...cfg.contas,...cfg.cartoes].map(x=>x.nome).filter(n=>n.length>=4);
  const achou=nomes.find(n=>t.includes(n.toLowerCase()));
  return achou||'';
}
function lerFaturaPDF(f){
  toast('Lendo a fatura…');
  const fr=new FileReader();
  fr.onerror=()=>toast('Não deu para abrir o PDF');
  fr.onload=async()=>{
    let r;
    try{ r=parseFatura(await pdfEmLinhas(new Uint8Array(fr.result))); }
    catch(e){ return toast('Não consegui ler esse PDF') }
    if(!r.itens.length)return toast('Não encontrei lançamentos nessa fatura');
    const c=cfg.cartoes[0]; if(!c)return toast('Cadastre um cartão primeiro');
    // a qual fatura do app essa pertence, pelo vencimento impresso

function agrupaRF(is){
  const out=[], achados={};
  for(const i of is){

// aplica o que o banco diz sobre contas e cartões
// A fatura que o banco emitiu vale mais que qualquer dedução de ciclo: ela traz
// a data de fechamento, a de vencimento e o total de cada mês. O ajuste é
// refeito a cada sincronização, nunca somado, e some conforme os lançamentos
// reais vão explicando o valor.
function aplicaFaturas(lista){
  let n=0;
  (lista||[]).forEach(({pg,faturas:fs})=>{
    const c=cartao(pg); if(!c||!(fs||[]).length)return;
    c.datas=c.datas||{}; c.aberturas=c.aberturas||{};
    delete c.auto; delete c.autoF; // bookkeeping de versões anteriores
    // as datas da fatura emitida valem para aquele mês; o ciclo corrente do
    // cartão vem da conta, que é o que o banco diz estar valendo agora
    if(c.doBanco!==false)fs.forEach(bl=>{
      const F=chaveFat(c,bl); if(!F||!bl.fecha||!bl.vence)return;
      c.datas[F]={f:+bl.fecha.slice(8,10),v:+bl.vence.slice(8,10)};
    });
    // o ajuste é a diferença até o total do banco, calculada sobre as compras
    // e não sobre si mesma: assim não depende de desfazer o de ontem
    const puro=faturas(c,true);
    const aberta=fatAberta(c);
    fs.forEach(bl=>{
      if(bl.total==null)return;
      const F=chaveFat(c,bl); if(!F)return;
      // a fatura aberta é a que ainda está sendo gasta: num cartão o banco
      // mostra o parcial certo, no outro ele oscila o dia inteiro
      if(F===aberta&&c.abertaBanco!==true)return;
      const v=r2(Math.abs(bl.total)-r2(puro[F]||0));
      if(Math.abs(v)>=0.005)c.aberturas[F]=v; else delete c.aberturas[F];
      // quem sabe se a fatura foi paga é o banco; sem isso todo histórico que
      // ele manda volta marcado em aberto
      const K=pagaKey(c,F), reg=cfg.faturasPagas[K];
      const quitada=bl.pago!=null&&Math.abs(bl.total)>0&&bl.pago>=Math.abs(bl.total)-0.01;
      if(quitada&&!reg)cfg.faturasPagas[K]={c:c.conta,d:bl.pagoEm||vencISO(c,F),auto:1};
      else if(!quitada&&reg&&reg.auto)delete cfg.faturasPagas[K];
    });
    Object.keys(c.aberturas).forEach(K=>{if(Math.abs(c.aberturas[K])<0.005)delete c.aberturas[K]});
    n++;
  });
  return n;
}
// a fatura é identificada pelo mês em que fecha; sem essa data, deduz do
// vencimento usando o ciclo que o cartão já tem
function chaveFat(c,bl){
  if(bl.fecha)return bl.fecha.slice(0,7);
  if(!bl.vence)return '';
  const M=bl.vence.slice(0,7);
  return venceDia(c,M)>fechaDia(c,M)?M:addM(M,-1);
}
function aplicaContas(achadas,comFatura){
  let n=0;
  // o banco só emite a fatura depois que ela fecha, então a aberta quase nunca
  // está na lista: nela o saldo ainda é a única medida que existe
  // Onde o banco manda as faturas, as fechadas vêm exatas e a aberta é a soma
  // das compras que chegaram. Completar a aberta por saldo exigia somar o que
  // está em aberto, e uma fatura antiga marcada errado ia parar dentro dela.
  (achadas||[]).forEach(a=>{
    if(!a.pg)return;
    if(a.tipo==='CREDIT'){
      const c=cartao(a.pg); if(!c)return;
      if(c.doBanco!==false){ // datas corrigidas à mão mandam mais que as do banco
        if(a.limite>0)c.limite=r2(a.limite);
        // a conta informa o ciclo que está valendo agora; a última fatura
        // emitida é o ciclo anterior, e logo depois de uma mudança são outros
        const dF=a.fecha&&/^\d{4}-\d{2}-\d{2}/.test(a.fecha)?+a.fecha.slice(8,10):0;
        const dV=a.vence&&/^\d{4}-\d{2}-\d{2}/.test(a.vence)?+a.vence.slice(8,10):0;
        if(dF>=1&&dF<=31)c.fecha=dF;
        if(dV>=1&&dV<=31)c.vence=dV;
      }
      // O saldo de um cartão é tudo o que se deve, não só a fatura aberta:
      // medir contra uma fatura só empurra para ela a dívida das outras. E o
      // ajuste é refeito, não somado — senão cada sincronização empilha mais
      // um, e o do mês anterior fica congelado numa fatura que já passou.
      // A fatura aberta é o que foi comprado nela, e ponto. O saldo do cartão
      // é uma dívida total que muda a toda hora e inclui o que ainda nem
      // apareceu; completar a fatura até ele enchia o mês de números sem
      // lançamento por trás. Fatura fechada continua vindo do banco, exata.
      if(c.auto&&c.auto.F){ // desfaz o que versões anteriores deixaram
        c.aberturas=c.aberturas||{};
        c.aberturas[c.auto.F]=r2((+c.aberturas[c.auto.F]||0)-(+c.auto.v||0));
        if(Math.abs(c.aberturas[c.auto.F])<0.005)delete c.aberturas[c.auto.F];
        delete c.auto;
      }
      n++;
    }else{
      const k=conta(a.pg); if(!k||a.saldo==null)return;
      k.saldo=r2((+k.saldo||0)+(r2(a.saldo)-saldoConta(a.pg)));
      n++;
    }
  });
  return n;
}

// porque lançar na conta errada é pior que esperar.
/**
 * O mesmo movimento já lançado. Pelo identificador, quando o documento
 * traz um.
 *
 * Sem identificador, só o comprovante é comparado por conta, dia, valor e
 * lado — ele é o único que pode ser enviado duas vezes. A notificação sai
 * da caixa assim que é lançada e nunca volta, então dois avisos iguais são
 * dois movimentos iguais, não um repetido: receber dois Pix de R$ 5 no
 * mesmo dia é comum, e recusar o segundo é perder dinheiro de vista.
 */
function achaIgual(n,data){
  // a notificação sai da caixa quando é lançada e nunca volta: nada que
  // venha dela é repetição, qualquer que seja o que o texto pareça trazer
  if(!/comprovante/.test(semAcento(n.banco||'')))return null;
  if(n.idTx)return todos().find(t=>t.idTx===n.idTx)||null;
  return todos().find(t=>t.pg===n.pg&&t.data===data&&t.t===n.t
    &&Math.abs(r2(t.v)-r2(+n.valor))<0.005)||null;
}
/**
 * O identificador diz que é o mesmo movimento; o resto pode ter mudado.
 * Reenviar um comprovante depois de o app aprender a lê-lo conserta o
 * lançamento que ele tinha feito errado, em vez de virar um segundo.
 * Devolve 'novo', 'corrigido' ou 'repetido'.
 */
let ultRepetido=null;
function poeOuCorrige(n,data,tx){
  const ja=achaIgual(n,data);
  if(ja)ultRepetido=ja;
  if(!ja){const K=mk(data);meses[K]=(meses[K]||[]).concat(tx);return 'novo'}
  const mudou=ja.pg!==tx.pg||ja.t!==tx.t||Math.abs(r2(ja.v)-r2(tx.v))>=0.005||ja.data!==data;
  if(!mudou)return 'repetido';
  if(ja.data!==data){ // mês diferente, outra gaveta
    const antes=mk(ja.data);meses[antes]=(meses[antes]||[]).filter(x=>x.id!==ja.id);
    const K=mk(data);meses[K]=(meses[K]||[]).concat(Object.assign(ja,{pg:tx.pg,t:tx.t,v:tx.v,data,desc:tx.desc,cat:tx.cat}));
  } else Object.assign(ja,{pg:tx.pg,t:tx.t,v:tx.v,desc:tx.desc,cat:tx.cat});
  return 'corrigido';
}

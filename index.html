function confirmarImport(){
  const ehCartao=!!cartao(imp.pg);
  const porMes={}; let n=0;
  let quitadas=0;
  imp.itens.filter(t=>t.usar).forEach(t=>{
    const vv=vImp(t), ent=vv>0, ehC=!!cartao(pgDe(t));
    if(t.quita){ // marca a fatura como paga, que já desconta da conta
      const c=cartao(t.quita.cid);
      if(c&&!paga(c,t.quita.F)){cfg.faturasPagas[pagaKey(c,t.quita.F)]={c:imp.pg,d:t.data};quitadas++}
      return;
    }
    if(ehC&&ent)return; // pagamento de fatura não é lançamento
    const tx={id:uid(),t:ent?'r':'d',v:r2(Math.abs(vv)),desc:t.desc,
      cat:t.cat||categorizar(t.desc,ent,vv),pg:pgDe(t),data:t.data,k:t.k};
    if(imp.fat&&ehC)tx.fat=imp.fat;
    const k=mk(t.data); (porMes[k]=porMes[k]||[]).push(tx); n++;
  });
  // sincronização pode não ter lançamento novo e ainda assim ter saldo e posição a acertar
  const temAcerto=imp.sync&&imp.acertar&&
    (((imp.achadas||[]).some(a=>a.pg))||((imp.invs||[]).some(i=>i.ativo!=='-')));
  const temMao=(imp.itens||[]).some(t=>t.mao);
  if(!n&&!quitadas&&!temAcerto&&!temMao){fechar();return toast('Nada marcado para importar')}
  Object.keys(porMes).forEach(k=>{meses[k]=(meses[k]||[]).concat(porMes[k])});
  // o que foi lançado à mão adota o id e a data do banco: deixa de ser palpite
  // e para de voltar como novidade. Antes do acerto de fatura, que usa a data.
  let casados=0;
  (imp.itens||[]).forEach(t=>{
    if(!t.mao)return;
    let achou=null, de='';
    Object.keys(meses).forEach(K=>{const x=meses[K].find(y=>y.id===t.mao);if(x){achou=x;de=K}});
    if(!achou)return;
    achou.k=t.k;
    if(achou.data!==t.data){
      achou.data=t.data;
      const para=mk(t.data);
      if(para!==de){meses[de]=meses[de].filter(y=>y.id!==achou.id);meses[para]=(meses[para]||[]).concat(achou)}
    }
    casados++;
  });
  let msg=n?(n+(n===1?' lançamento importado':' lançamentos importados')):'Nada novo para lançar';
  if(quitadas)msg+=', '+quitadas+(quitadas===1?' fatura quitada':' faturas quitadas');
  if(casados)msg+=', '+casados+(casados===1?' já era seu lançamento':' já eram seus lançamentos');
  if(imp.saldo!=null&&imp.ajusta&&!ehCartao){
    const c=conta(imp.pg);
    if(c){c.saldo=r2((+c.saldo||0)+(imp.saldo-saldoConta(imp.pg)));msg+=', saldo acertado'}
  }
  if(imp.sync){
    if(imp.acertar){
      const nf=aplicaFaturas(imp.fats);if(nf)msg+=', '+nf+(nf===1?' cartão com a fatura do banco':' cartões com a fatura do banco');
      const n=aplicaContas(imp.achadas,imp.fats);if(n)msg+=', '+n+(n===1?' conta acertada':' contas acertadas');
      const v=aplicaInvestimentos();if(v)msg+=', '+v+(v===1?' investimento':' investimentos');
    }
    // só avança a marca das contas cujo extrato foi realmente lido: uma conta
    // apontada agora nesta tela ainda não foi buscada e precisa do histórico
    cfg.bancos.forEach(b=>{
      const minhas=(imp.achadas||[]).filter(a=>a.banco===b.id);
      if(!minhas.length)return;
      b.desdeC=b.desdeC||{};
      minhas.forEach(a=>{if(a.pgIni)b.desdeC[a.pid]=hoje()});
      if(minhas.every(a=>a.pgIni))b.desde=hoje();
    });
  }
  const apontadas=(imp.achadas||[]).some(a=>a.pg&&!a.pgIni);
  cache();imp=null;fechar();render();
  toast(msg);
  if(apontadas)setTimeout(()=>sincronizar(),400); // busca o extrato de quem acabou de ganhar destino
}


/* ---------- fatura em PDF ---------- */
const MESAB={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
const L_LANC=/^(\d{1,2})\s*de\s*([a-zç]{3,4})\.?\s*(\d{4})\s*(.*?)\s{2,}(\+\s*)?R\$\s*([\d.]+,\d{2})\s*$/i;
let pdfLib=null;
async function carregaPDF(){
  if(pdfLib)return pdfLib;
  const m=await import('./vendor/pdf.min.mjs');
  m.GlobalWorkerOptions.workerSrc='./vendor/pdf.worker.min.mjs';
  return (pdfLib=m);
}
// cada página vira linhas de texto, agrupando por altura e marcando as colunas
async function pdfEmLinhas(dados){
  const lib=await carregaPDF();
  const doc=await lib.getDocument({data:dados,useSystemFonts:true}).promise;
  const linhas=[];
  for(let p=1;p<=doc.numPages;p++){
    const tc=await (await doc.getPage(p)).getTextContent();
    const porY=new Map();
    for(const it of tc.items){
      if(!it.str||!it.str.trim())continue;
      const y=Math.round(it.transform[5]);
      const k=[...porY.keys()].find(q=>Math.abs(q-y)<=2);
      if(k===undefined)porY.set(y,[]);
      porY.get(k===undefined?y:k).push({x:it.transform[4],s:it.str});
    }
    [...porY.entries()].sort((a,b)=>b[0]-a[0]).forEach(([,its])=>{
      its.sort((a,b)=>a.x-b.x);
      let t='',fim=null;
      for(const it of its){
        if(fim!==null&&it.x-fim>6)t+='  ';
        t+=it.s; fim=it.x+it.s.length*5;
      }
      linhas.push(t.replace(/\s+$/,''));
    });
  }
  return linhas;
}
function parseFatura(linhas){
  const itens=[];
  for(const l of linhas){
    const m=L_LANC.exec(String(l).trim()); if(!m)continue;
    const mes=MESAB[m[2].toLowerCase().slice(0,3)]; if(!mes)continue;
    const partes=m[4].split(/\s{2,}/).map(x=>x.trim()).filter(Boolean);
    const mov=partes[0]||'', ben=partes.length>1?partes[partes.length-1]:'';
    const desc=limpaDesc(mov+((ben&&ben!=='-')?' — '+ben:''));
    const val=numBR(m[6]); if(!isFinite(val)||val===0)continue;
    itens.push({data:m[3]+'-'+p2(mes)+'-'+p2(m[1]),v:m[5]?val:-val,desc,fit:''});
  }
  const txt=linhas.join('\n');
  const achaData=rot=>{
    const i=linhas.findIndex(l=>rot.test(l));
    if(i<0)return '';
    for(let j=i;j<Math.min(i+4,linhas.length);j++){
      const d=/(\d{2})\/(\d{2})\/(\d{4})/.exec(linhas[j]);
      if(d)return d[3]+'-'+d[2]+'-'+d[1];
    }
    return '';
  };
  const venc=achaData(/data de vencimento/i);
  const total=(/despesas do m[êe]s[\s\S]{0,60}?R\$\s*([\d.]+,\d{2})/i.exec(txt)||[])[1];
  return {itens,venc,total:total?numBR(total):null};
}

function futurasDe(c,F){ // o que já está comprometido mas cai depois da fatura aberta
  const f=faturas(c); let t=0;

  return r2(t);
}

  const F=fatAberta(c), aberta=r2(faturas(c)[F]||0), fut=futurasDe(c,F), u=usado(c);
  abrir(cab('Acertar o '+esc(c.nome))+

function salvaAcerto(cid){
  const c=cartao(cid), F=fatAberta(c);
  const nova=num(val('af_v')), novoU=num(val('af_u'));
  if(!(nova>=0))return toast('Valor da fatura inválido');
  if(val('af_u')!==undefined&&!(novoU>=0))return toast('Limite utilizado inválido');
  if(novoU>=0&&novoU+0.005<nova)return toast('O utilizado não pode ser menor que a fatura aberta');
  c.aberturas=c.aberturas||{};
  // fatura aberta: completa a diferença, preservando o que já foi lançado
  c.aberturas[F]=r2((+c.aberturas[F]||0)+(nova-r2(faturas(c)[F]||0)));
  // parcelas futuras: o resto do limite utilizado vai para a fatura seguinte
  if(novoU>=0){
    const alvo=r2(novoU-nova), prox=addM(F,1);
    c.aberturas[prox]=r2((+c.aberturas[prox]||0)+(alvo-futurasDe(c,F)));
  }
  Object.keys(c.aberturas).forEach(K=>{if(Math.abs(c.aberturas[K])<0.005)delete c.aberturas[K]});
  salvarCfg();fechar();
  toast('Cartão acertado: '+brl(usado(c))+' comprometidos');
}

async function wk(caminho,params,opts){
  if(!temSync())throw new Error('sem_config');

// quando a Pluggy leu o banco pela última vez: é esse o relógio que manda,
// não o da sincronização do app
function quando(iso){
  const d=new Date(iso); if(isNaN(d))return '';
  const h=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const min=Math.round((Date.now()-d.getTime())/60000);
  if(min<90)return 'há '+(min<2?'instantes':min+' minutos');
  const local=d.toLocaleDateString('sv-SE'); // data no fuso de quem lê, não em UTC
  const ontem=new Date(Date.now()-864e5).toLocaleDateString('sv-SE');
  if(local===hoje())return 'hoje às '+h;
  if(local===ontem)return 'ontem às '+h;
  return dataBR(local)+' às '+h;
}

// mapeia cada conta da Pluggy para uma conta ou cartão do app
function destinoPluggy(b,c){
  if(b.mapa&&b.mapa[c.id])return b.mapa[c.id];
  const alvo=c.tipo==='CREDIT'?cfg.cartoes:cfg.contas;
  const nome=semAcento((c.banco||'')+' '+(c.nome||''));

}
let pend=null; // resultado de uma sincronização automática, esperando revisão
async function sincronizar(auto){
  if(!cfg.bancos.length)return auto?null:toast('Nenhum banco conectado');
  if(sincronizando)return;
  sincronizando=true;
  if(!auto)toast('Sincronizando…');
  const itens=[], achadas=[], invs=[], erros=[], contas_fat=[];
  for(const b of cfg.bancos){
    try{
      ((await wk('/investimentos',{itemId:b.id})).investimentos||[]).forEach(i=>{
        if(i.saldo==null)return;
        invs.push({...i,ativo:casaAtivo(i)});
      });
    }catch(e){ /* nem todo banco devolve investimento */ }
    let contas;
    try{ contas=(await wk('/contas',{itemId:b.id})).contas||[] }
    catch(e){ erros.push({b:b.nome||'Banco',m:msgErro(e.message)}); continue }
    // lista vazia não é erro, mas é o motivo de nenhum extrato aparecer
    if(!contas.length)erros.push({b:b.nome||'Banco',
      m:'o banco não devolveu nenhuma conta. Se ele só mostrou investimentos, a conexão no meu.pluggy.ai provavelmente não autorizou conta corrente e cartão'});
    for(const c of contas){
      let pg=destinoPluggy(b,c);
      if(pg&&achadas.some(x=>x.pg===pg)){ // duplicado já gravado: desfaz e deixa escolher
        pg=''; if(b.mapa)delete b.mapa[c.id]; salvarCfg();
      }
      achadas.push({pid:c.id,banco:b.id,nome:c.nome,marca:c.banco,tipo:c.tipo,
        saldo:c.saldo,limite:c.limite,fecha:c.fecha,vence:c.vence,pg,pgIni:pg});
      if(!pg)continue; // sem destino: aparece na revisão para o usuário apontar
      // num cartão, a fatura existe pronta: datas e total, sem deduzir ciclo
      if(c.tipo==='CREDIT'&&cartao(pg)){
        try{ const fs=(await wk('/faturas',{accountId:c.id})).faturas||[];
             if(fs.length)contas_fat.push({pg,faturas:fs}); }
        catch(e){ erros.push({b:(b.nome||'Banco')+' · '+c.nome,m:msgErro(e.message)}) }
      }
      let lancs=[];
      // nunca sincronizado: busca o máximo que o Open Finance costuma guardar
      const desde=(b.desdeC&&b.desdeC[c.id])||b.desde||addM(mk(hoje()),-12)+'-01';
      try{ lancs=(await wk('/lancamentos',{accountId:c.id,desde})).lancamentos||[] }
      catch(e){ erros.push({b:(b.nome||'Banco')+' · '+c.nome,m:msgErro(e.message)}); continue }
      for(const l of lancs){
        if(!l.data||!l.valor)continue;
        itens.push({data:l.data,v:l.valor,desc:limpaDesc(l.descricao),fit:'p:'+l.id,pg,tp:l.tipo||''});
      }
    }
  }
  const invsAg=agrupaRF(invs);
  cfg.syncTs=Date.now();cache();
  sincronizando=false;
  const semDestino=achadas.filter(a=>!a.pg).length;
  if(!itens.length&&!semDestino&&!invsAg.length){
    if(erros.length)return auto?null:toast('Não deu para trazer de '+erros[0].b+': '+erros[0].m);
    // nada novo para lançar não é nada novo para saber: saldo e fatura mudam
    // sozinhos, e são o que a tela mostra primeiro
    const foto=()=>JSON.stringify([cfg.contas.map(c=>c.saldo),cfg.cartoes.map(c=>[c.limite,c.fecha,c.vence,c.aberturas])]);
    const antes=foto();
    aplicaFaturas(contas_fat);
    aplicaContas(achadas,contas_fat);
    const mudou=foto()!==antes;
    if(mudou){salvarCfg();render()}
    return auto?null:toast(mudou?'Saldos e faturas atualizados':'Nada novo para trazer');
  }
  itens.sort((a,b)=>a.data.localeCompare(b.data));
  const antigos=todos();
  const jaTem=new Set(antigos.map(x=>x.k));
  // Gasto no crédito demora um dia para o banco processar, então quem quer ver
  // na hora lança à mão. Quando o banco enfim manda o mesmo gasto, ele vem com
  // outra descrição e às vezes outro dia: casar por valor e proximidade evita
  // a escolha entre lançar duas vezes ou não lançar na hora.
  const aMao=antigos.filter(x=>x.t==='d'&&!x.k&&cartao(x.pg));
  const casadosMao=new Set();
  const casaMao=t=>{
    if(!(t.v<0)||!cartao(t.pg))return '';
    const v=r2(Math.abs(t.v));
    const x=aMao.find(y=>!casadosMao.has(y.id)&&y.pg===t.pg&&r2(y.v)===v&&Math.abs(difD(y.data,t.data))<=5);
    if(!x)return '';
    casadosMao.add(x.id); return x.id;
  };
  // Reconectar o banco repete os mesmos lançamentos com ids novos, e por isso
  // o conteúdo também conta. Mas duas passagens iguais no mesmo dia são duas
  // passagens: o que importa é quantas já existem, não se alguma existe.
  const quantos={}, usados={};
  antigos.forEach(t=>{const h=semOrigemLanc(t);quantos[h]=(quantos[h]||0)+1});
  const montado={pg:(itens[0]||{}).pg||(cfg.contas[0]||{}).id,inv:false,saldo:null,ajusta:false,
    sync:true,achadas,invs:invsAg,erros,fats:contas_fat,acertar:true,itens:itens.map(t=>{
    // CREDIT num cartão é dinheiro entrando nele: pagamento ou estorno, nunca compra
    const k=chaveTx(t);
    const nat=natureza(t.desc)||(cartao(t.pg)&&String(t.tp||'').toUpperCase()==='CREDIT'?'fatura':'');
    const hh=semOrigem(t), ja=(usados[hh]=(usados[hh]||0)+1);
    const dup=jaTem.has(k)||ja<=(quantos[hh]||0);
    const mao=dup?'':casaMao(t);
    return {...t,k,dup,mao,nat,quita:null,met:'',usar:!dup&&!mao&&!nat,cat:categorizar(t.desc,t.v>0,t.v)};
  })};
  const novos=montado.itens.filter(t=>t.usar).length+semDestino+invsAg.length;
  if(auto){
    if(!novos){pend=null;render();return}      // só repetidos: nada a fazer
    if(cfg.syncDireto){imp=montado;confirmarImport();return}
    pend=montado;render();                      // avisa na tela inicial
    return;
  }
  pend=null;imp=montado;fechar();formImportar();
}
const curto=m=>String(m||'').slice(0,90);
// os códigos do backend não dizem nada para quem lê a tela
function msgErro(m){
  m=String(m||'');
  if(m==='sem_config')return 'o endereço do backend não está preenchido';
  if(m==='token_recusado'||/^http_40[13]$/.test(m))return 'o backend recusou o token';
  if(/^http_5/.test(m))return 'o backend não respondeu';
  if(/^http_/.test(m))return 'o backend devolveu erro '+m.slice(5);
  if(/LOGIN_ERROR|INVALID_CREDENTIALS/i.test(m))return 'a conexão com o banco expirou — reconecte em meu.pluggy.ai';
  if(/UPDATING|OUTDATED/i.test(m))return 'o banco ainda está atualizando os dados — tente de novo em alguns minutos';
  if(/rate.?limit|too many|\b429\b/i.test(m))return 'a Pluggy já foi consultada há pouco; vale uma vez por hora';
  if(/cant be update|cannot be updated/i.test(m))return 'essa conexão não aceita releitura pela API';
  if(/Failed to fetch|NetworkError/i.test(m))return 'não alcancei o backend';
  return curto(m);
}

async function syncAoAbrir(){
  if(!cfg.syncAuto||!temSync()||!cfg.bancos.length)return;
  if(!navigator.onLine)return;
  // Perguntar quando a Pluggy leu o banco é uma chamada barata, e responde a
  // única pergunta que importa: tem coisa nova lá? Se tem, sincroniza na hora,
  // sem esperar as quatro horas. Se não tem, sincronizar não traria nada.
  let novidade=false;
  for(const b of cfg.bancos){
    try{ const r=await wk('/item',{itemId:b.id});
         if(r.atualizadoEm&&r.atualizadoEm!==b.lidoEm){b.lidoEm=r.atualizadoEm;novidade=true} }
    catch(e){}
  }
  if(novidade)salvarCfg();
  if(!novidade&&cfg.syncTs&&Date.now()-cfg.syncTs<4*60*60*1000)return;
  try{await sincronizar(true)}catch(e){sincronizando=false}
}

// A Pluggy guarda uma cópia do banco e a refaz de tempos em tempos. Sincronizar
// lê essa cópia; isto pede uma cópia nova. A conexão do plano gratuito não
// aceita o pedido pela API, e aí o caminho é o próprio widget.
async function relerBanco(id){
  const b=cfg.bancos.find(x=>x.id===id); if(!b)return;
  toast('Pedindo…');
  try{
    await wk('/atualizar',{itemId:id},{method:'POST'});
    b.pedidoEm=Date.now(); leiturasVistas=false; salvarCfg();
    return toast('Pedido feito. Sincronize daqui a alguns minutos.');
  }catch(e){
    // a conexão do plano gratuito recusa o pedido aqui e também pelo conector:
    // a releitura é feita no próprio Meu Pluggy
    if(/cant be update|cannot be updated|MeuPluggy/i.test(String(e.message||'')))
      return abrir(cab('Reler o '+esc(b.nome||'banco'))+
      `<p class="hint" style="padding-left:0">Esta conexão é do plano gratuito, e ela não aceita o pedido de releitura nem por aqui nem pelo conector. Nas palavras da própria Pluggy: os itens do Meu Pluggy só podem ser atualizados pelo aplicativo dela, e são atualizados uma vez por dia de todo jeito.</p>
      <div class="note"><b>Como forçar agora</b>Abra a conexão do banco no Meu Pluggy e atualize por lá — costuma ser uma seta circular ou "Atualizar" no card da conexão. Depois volte aqui e sincronize.</div>
      <div class="acts"><a class="btn" href="https://meu.pluggy.ai" target="_blank" rel="noopener noreferrer">Abrir o Meu Pluggy</a></div>
      <p class="hint" style="padding-left:0">Mesmo assim, compra no crédito costuma levar um dia para o banco processar — até lá não existe nem para ele.</p>
      <div class="acts fim"><button class="btn g" onclick="formSync()">Voltar</button>
      <button class="btn g" onclick="fechar();sincronizar()">Sincronizar assim mesmo</button></div>`);
    return toast(msgErro(e.message));
  }
}

function copia(id,ok){
  const e=$('#'+id); if(!e||!e.value)return toast('Está vazio');
  const feito=()=>toast(ok);
  if(navigator.clipboard&&navigator.clipboard.writeText)
    return navigator.clipboard.writeText(e.value).then(feito).catch(()=>{e.select();toast('Selecionado — toque em Copiar')});
  e.select(); try{document.execCommand('copy');feito()}catch(x){toast('Selecionado — toque em Copiar')}
}

  <h4>Orçamento <span class="n" style="float:right;color:var(--ink)">${brl(tot)}</span></h4><p class="hint" style="padding-left:0">Quanto quer gastar no máximo por mês em cada coisa.</p>`;
  rasc.categorias.forEach((c,i)=>{h+=`<div class="catrow"><input id="k_e${i}" value="${esc(c.emoji)}" maxlength="4" style="text-align:center"><input id="k_n${i}" value="${esc(c.nome)}"><input id="k_o${i}" inputmode="decimal" value="${n2(c.orc)}"><button class="rm" onclick="remCat(${i})" aria-label="Remover">×</button></div>`});
  h+=`<button class="btn g s" onclick="addCat()" style="margin-top:6px">Adicionar categoria</button>
  <h4>Cotações</h4><p class="hint" style="padding-left:0">${getTk()?'Token da brapi salvo neste aparelho.':'Sem token. Só ITUB4, PETR4, VALE3 e MGLU3 atualizam sozinhas.'}</p>
  <button class="btn g s" onclick="formToken()">${getTk()?'Trocar token':'Colar token da brapi'}</button>
  ${apkVelho()?`<div class="note" style="border-left-color:var(--warn)"><b>Tem uma versão nova do aplicativo</b>O site se atualiza sozinho, mas desta vez mudou a parte que fica no aparelho. Baixe e instale por cima — seus dados ficam. <a href="${APK_LINK}">Baixar o APK</a></div>`:''}
  ${noAparelho()?`<h4>Notificações do banco</h4>
  <p class="hint" style="padding-left:0">${podeOuvir()
    ? 'O app está recebendo as notificações dos seus bancos e guarda as que têm valor, para você lançar quando abrir. Elas ficam só neste aparelho.'
    : 'Com a permissão de leitura de notificações, a compra no crédito aparece aqui no momento em que o banco avisa, sem esperar o dia que ele leva para processar.'}</p>
  <div class="acts"><button class="btn ${podeOuvir()?'g':''}" onclick="Aparelho.pedirPermissao()">${podeOuvir()?'Rever a permissão':'Dar a permissão'}</button>
  ${notifs().length?`<button class="btn g" onclick="formNotifs()">Ver ${notifs().length} esperando</button>`:''}</div>
  ${podeOuvir()?`<div class="ilin" style="border-bottom:0" onclick="cfg.notifDireto=!cfg.notifDireto;salvarCfg();abrirAjustes()">
    <button class="ick" style="${cfg.notifDireto?'':'background:none;border-color:var(--line2)'}">${cfg.notifDireto?'✓':''}</button>
    <div class="imid"><div class="t1">Lançar sem revisar</div>
    <div class="t2">Entra direto quando o app abre, mas só quando o aviso diz de qual conta ou cartão saiu — ou quando você já escolheu o destino daquele banco uma vez. O que ficar em dúvida continua esperando.</div></div></div>`:''}`:''}

  ${cfg.promoFora>0?`<div class="ilin" style="border-bottom:0" onclick="verPromo()">
    <div class="imid"><div class="t1">${cfg.promoFora} aviso${cfg.promoFora===1?'':'s'} de propaganda ignorado${cfg.promoFora===1?'':'s'}</div>
    <div class="t2">Anúncio com preço dentro não é compra. Veja o último, caso algo de verdade tenha sido recusado.</div></div><div class="iarr">›</div></div>`:''}
  ${cfg.ultComp?`<div class="ilin" style="border-bottom:0" onclick="verComp()">
    <div class="imid"><div class="t1">Ver o último comprovante lido</div>
    <div class="t2">O texto que o app enxergou na figura. Serve para entender uma leitura que saiu errada.</div></div><div class="iarr">›</div></div>`:''}

  <h4>Minhas regras de categoria</h4><p class="hint" style="padding-left:0">${(cfg.regras||[]).length?(cfg.regras.length===1?'1 regra sua':cfg.regras.length+' regras suas')+'. O app usa elas antes das próprias.':'Ensine o app a reconhecer o que só você sabe, como um Pix que é sempre a mesma conta.'}</p>
  <div class="acts"><button class="btn g" onclick="formRegras()">Ver e criar regras</button></div>

  <h4>Backup</h4><p class="hint" style="padding-left:0">Seus dados ficam neste aparelho. Baixe um backup de vez em quando, ou para levar para outro celular.</p>
  <div class="acts"><button class="btn g" onclick="exportar()">Baixar backup</button>
  <button class="btn g" onclick="document.getElementById('imp').click()">Restaurar backup</button></div>
  <input type="file" id="imp" style="display:none" onchange="importar(this)">
  <h4>Sincronização</h4><p class="hint" style="padding-left:0">${temSync()?(cfg.bancos.length?cfg.bancos.length+(cfg.bancos.length===1?' banco conectado':' bancos conectados'):'Backend configurado, nenhum banco ainda.'):'Puxar lançamentos direto do banco, sem baixar extrato.'}</p>
  <div class="acts"><button class="btn g" onclick="formSync()">${temSync()?'Gerenciar':'Configurar'}</button></div>
  <h4>Recomeçar</h4><p class="hint" style="padding-left:0">Apagar lançamentos, zerar o saldo anterior dos cartões ou limpar tudo.</p>
  <div class="acts"><button class="btn g" onclick="formRecomecar()">Opções de apagar</button></div>
  <p class="hint" style="text-align:center;padding-top:14px">Versão ${VERSAO}
  <a onclick="forcaAtualizar()" style="margin-left:8px">Buscar versão nova</a></p>
  <div class="acts fim"><button class="btn g" onclick="fechar()">Cancelar</button><button class="btn" onclick="salvarAjustes()">Salvar</button></div>`;
  abrir(h);
}
function editarCartao(id){lerAjustes();cfg=rasc;rasc=null;salvarCfg();formCartao(id)}
function addCat(){lerAjustes();rasc.categorias.push({id:uid(),emoji:'📦',nome:'Nova',orc:0});formAjustes();const s=$('#sheet');s.scrollTop=s.scrollHeight}
function remCat(i){lerAjustes();rasc.categorias.splice(i,1);formAjustes()}
function salvarAjustes(){lerAjustes();delete rasc._visto;cfg=rasc;rasc=null;salvarCfg();fechar();toast('Ajustes salvos')}

iniciar();
</script>
</body>
</html>
